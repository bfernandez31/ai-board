openapi: 3.1.0
info:
  title: Workflow Owner Credential Retrieval API
  version: 1.0.0
  description: Workflow-only endpoint for resolving the active owner credential for a project and provider.

servers:
  - url: http://localhost:3000
    description: Local development

paths:
  /api/workflow/credentials/owner:
    post:
      summary: Retrieve the current project owner's ready credential for a provider
      operationId: getWorkflowOwnerCredential
      tags:
        - Workflow Credentials
      security:
        - WorkflowBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowOwnerCredentialRequest'
      responses:
        '200':
          description: Owner credential resolved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowOwnerCredentialResponse'
        '401':
          description: Missing or invalid workflow token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowCredentialError'
              examples:
                invalidToken:
                  value:
                    error: Unauthorized
                    code: UNAUTHORIZED
        '409':
          description: Workflow cannot proceed because the owner credential is not usable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowCredentialError'
              examples:
                missing:
                  value:
                    error: Project owner must configure an Anthropic credential before launching AI workflows.
                    code: OWNER_CREDENTIAL_MISSING
                invalid:
                  value:
                    error: Project owner credential is invalid and must be updated.
                    code: OWNER_CREDENTIAL_INVALID
                expired:
                  value:
                    error: Project owner credential expired and must be refreshed.
                    code: OWNER_CREDENTIAL_EXPIRED
                unverifiable:
                  value:
                    error: Project owner credential could not be verified. Retry after the owner revalidates it.
                    code: OWNER_CREDENTIAL_UNVERIFIED
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowCredentialError'
        '500':
          description: Secure retrieval failed and the system failed closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowCredentialError'

components:
  securitySchemes:
    WorkflowBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: WORKFLOW_API_TOKEN

  schemas:
    WorkflowOwnerCredentialRequest:
      type: object
      required:
        - projectId
        - provider
      properties:
        projectId:
          type: integer
          minimum: 1
        provider:
          type: string
          enum: [ANTHROPIC]
        ticketId:
          type:
            - integer
            - 'null'
          minimum: 1
        jobId:
          type:
            - integer
            - 'null'
          minimum: 1
      additionalProperties: false

    WorkflowOwnerCredentialResponse:
      type: object
      required:
        - provider
        - credentialType
        - authMethod
        - secret
        - ownerUserId
        - label
      properties:
        provider:
          type: string
          enum: [ANTHROPIC]
        credentialType:
          type: string
          enum: [API_KEY, OAUTH_TOKEN]
        authMethod:
          type: string
          enum: [anthropic-api-key, anthropic-oauth-token]
        secret:
          type: string
        ownerUserId:
          type: string
        label:
          type: string

    WorkflowCredentialError:
      type: object
      required:
        - error
        - code
      properties:
        error:
          type: string
        code:
          type: string
          enum:
            - UNAUTHORIZED
            - PROJECT_NOT_FOUND
            - OWNER_CREDENTIAL_MISSING
            - OWNER_CREDENTIAL_INVALID
            - OWNER_CREDENTIAL_EXPIRED
            - OWNER_CREDENTIAL_UNVERIFIED
            - SECURE_RETRIEVAL_FAILED
        remediation:
          type:
            - string
            - 'null'
