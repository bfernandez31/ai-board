openapi: 3.1.0
info:
  title: AI Credential Settings API
  version: 1.0.0
  description: User-facing endpoints for managing masked BYOK credentials in personal settings.

servers:
  - url: http://localhost:3000
    description: Local development

paths:
  /api/settings/ai-credentials/{provider}:
    get:
      summary: Get current masked AI credential metadata
      operationId: getAiCredential
      tags:
        - Settings
        - AI Credentials
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/AiProvider'
      responses:
        '200':
          description: Current masked credential state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiCredentialViewResponse'
        '401':
          description: Session required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Unsupported provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Save or replace the current provider credential
      operationId: saveAiCredential
      tags:
        - Settings
        - AI Credentials
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/AiProvider'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveAiCredentialRequest'
      responses:
        '200':
          description: Credential verified and activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiCredentialViewResponse'
        '400':
          description: Validation or provider-verification failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_format:
                  value:
                    error: Credential format is invalid for the selected type
                    code: INVALID_CREDENTIAL_FORMAT
                invalid_provider_response:
                  value:
                    error: Anthropic rejected this credential. Check the value and try again.
                    code: OWNER_CREDENTIAL_INVALID
        '401':
          description: Session required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Provider verification unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Delete the current provider credential
      operationId: deleteAiCredential
      tags:
        - Settings
        - AI Credentials
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/AiProvider'
      responses:
        '200':
          description: Credential deleted and no longer usable for workflows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteAiCredentialResponse'
        '401':
          description: Session required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    AiProvider:
      type: string
      enum:
        - ANTHROPIC

    AiCredentialType:
      type: string
      enum:
        - API_KEY
        - OAUTH_BEARER

    CredentialReadinessStatus:
      type: string
      enum:
        - MISSING
        - READY
        - INVALID
        - ERROR
        - DELETED

    SaveAiCredentialRequest:
      type: object
      required:
        - credentialType
        - label
        - secret
      properties:
        credentialType:
          $ref: '#/components/schemas/AiCredentialType'
        label:
          type: string
          minLength: 1
          maxLength: 100
        secret:
          type: string
          minLength: 1
          writeOnly: true

    AiCredentialViewResponse:
      type: object
      required:
        - provider
        - credentialType
        - label
        - maskedPreview
        - readinessStatus
        - lastVerifiedAt
        - lastFailureCode
        - lastFailureMessage
      properties:
        provider:
          $ref: '#/components/schemas/AiProvider'
        credentialType:
          oneOf:
            - $ref: '#/components/schemas/AiCredentialType'
            - type: 'null'
        label:
          type:
            - string
            - 'null'
        maskedPreview:
          type:
            - string
            - 'null'
          maxLength: 4
        readinessStatus:
          $ref: '#/components/schemas/CredentialReadinessStatus'
        lastVerifiedAt:
          type:
            - string
            - 'null'
          format: date-time
        lastFailureCode:
          type:
            - string
            - 'null'
        lastFailureMessage:
          type:
            - string
            - 'null'

    DeleteAiCredentialResponse:
      type: object
      required:
        - provider
        - deleted
      properties:
        provider:
          $ref: '#/components/schemas/AiProvider'
        deleted:
          type: boolean
          const: true

    ErrorResponse:
      type: object
      required:
        - error
        - code
      properties:
        error:
          type: string
        code:
          type: string
