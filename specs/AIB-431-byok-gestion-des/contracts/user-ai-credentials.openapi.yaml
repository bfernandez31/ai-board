openapi: 3.1.0
info:
  title: User AI Credentials API
  version: 1.0.0
  description: User settings API for managing provider credentials used by AI workflows.

servers:
  - url: http://localhost:3000
    description: Local development

paths:
  /api/ai-credentials:
    get:
      summary: List the authenticated user's AI credentials
      operationId: listAiCredentials
      tags:
        - AI Credentials
      responses:
        '200':
          description: Credential metadata returned successfully
          content:
            application/json:
              schema:
                type: object
                required: [credentials]
                properties:
                  credentials:
                    type: array
                    items:
                      $ref: '#/components/schemas/AiCredentialSummary'
        '401':
          $ref: '#/components/responses/AuthRequired'
    post:
      summary: Create or replace the authenticated user's active credential for a provider
      operationId: saveAiCredential
      tags:
        - AI Credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveAiCredentialRequest'
      responses:
        '201':
          description: Credential saved and verified
          content:
            application/json:
              schema:
                type: object
                required: [credential]
                properties:
                  credential:
                    $ref: '#/components/schemas/AiCredentialSummary'
        '400':
          description: Validation or provider verification failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/AuthRequired'

  /api/ai-credentials/{credentialId}:
    delete:
      summary: Delete the authenticated user's credential
      operationId: deleteAiCredential
      tags:
        - AI Credentials
      parameters:
        - name: credentialId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Credential deleted
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
                    const: true
        '401':
          $ref: '#/components/responses/AuthRequired'
        '404':
          description: Credential not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

components:
  responses:
    AuthRequired:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            default:
              value:
                error: Unauthorized
                code: AUTH_REQUIRED

  schemas:
    SaveAiCredentialRequest:
      type: object
      required:
        - provider
        - credentialType
        - label
        - secret
      properties:
        provider:
          type: string
          enum: [ANTHROPIC]
        credentialType:
          type: string
          enum: [API_KEY, OAUTH_TOKEN]
        label:
          type: string
          minLength: 1
          maxLength: 100
        secret:
          type: string
          minLength: 1
      additionalProperties: false

    AiCredentialSummary:
      type: object
      required:
        - id
        - provider
        - credentialType
        - label
        - maskedPreview
        - readinessStatus
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        provider:
          type: string
          enum: [ANTHROPIC]
        credentialType:
          type: string
          enum: [API_KEY, OAUTH_TOKEN]
        label:
          type: string
        maskedPreview:
          type: string
          minLength: 4
          maxLength: 4
        readinessStatus:
          type: string
          enum: [PENDING_VERIFICATION, READY, INVALID, EXPIRED, UNVERIFIED]
        verificationErrorCode:
          type:
            - string
            - 'null'
        verificationMessage:
          type:
            - string
            - 'null'
        lastVerifiedAt:
          type:
            - string
            - 'null'
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ApiError:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string
          enum:
            - AUTH_REQUIRED
            - VALIDATION_ERROR
            - PROVIDER_VERIFICATION_FAILED
            - PROVIDER_UNAVAILABLE
            - NOT_FOUND
            - INTERNAL_ERROR
        details:
          type:
            - object
            - 'null'
          additionalProperties: true
