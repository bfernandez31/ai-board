openapi: 3.1.0
info:
  title: Workflow Owner Credential Retrieval API
  version: 1.0.0
  description: Internal workflow-only endpoint for resolving the current project owner's provider credential.

servers:
  - url: http://localhost:3000
    description: Local development

paths:
  /api/internal/workflows/projects/{projectId}/providers/{provider}/credential:
    post:
      summary: Resolve project owner's credential for workflow execution
      description: |
        Authenticated only by `Authorization: Bearer <WORKFLOW_API_TOKEN>`.
        Returns the active project owner's credential payload for the requested provider.
        Fails closed if the owner credential is missing, invalid, deleted, expired, or cannot be verified.
      operationId: resolveOwnerWorkflowCredential
      tags:
        - Workflow Internal
        - AI Credentials
      security:
        - WorkflowBearer: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [anthropic]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowCredentialRequest'
      responses:
        '200':
          description: Owner credential resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResolvedCredential'
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_request:
                  value:
                    error: Invalid workflow credential request
                    code: VALIDATION_ERROR
        '401':
          description: Missing or invalid workflow token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  value:
                    error: Unauthorized
                    code: UNAUTHORIZED
        '404':
          description: Project or owner credential not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                project_not_found:
                  value:
                    error: Project not found
                    code: PROJECT_NOT_FOUND
                credential_missing:
                  value:
                    error: Project owner does not have a usable Anthropic credential
                    code: OWNER_CREDENTIAL_MISSING
                    message: Project owner must configure a valid Anthropic credential in Settings.
        '409':
          description: Owner credential exists but is not usable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                action_required:
                  value:
                    error: Project owner credential requires attention
                    code: OWNER_CREDENTIAL_ACTION_REQUIRED
                    message: Project owner must replace or re-verify the Anthropic credential before launching this workflow.
        '503':
          description: Verification/retrieval failed and launch must stop
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                verification_unavailable:
                  value:
                    error: Unable to verify project owner credential
                    code: CREDENTIAL_RETRIEVAL_FAILED
                    message: Retry later or ask the project owner to re-save the Anthropic credential.

components:
  securitySchemes:
    WorkflowBearer:
      type: http
      scheme: bearer
      bearerFormat: WORKFLOW_API_TOKEN

  schemas:
    WorkflowCredentialRequest:
      type: object
      required:
        - command
      properties:
        ticketId:
          type:
            - integer
            - 'null'
          minimum: 1
        jobId:
          type:
            - integer
            - 'null'
          minimum: 1
        command:
          type: string
          enum:
            - specify
            - plan
            - implement
            - verify
            - ship
            - quick-impl
            - deploy-preview
            - rollback-reset
            - iterate
            - comment-specify
            - comment-plan
            - comment-build
            - comment-verify
            - comment-ship
            - health-scan

    WorkflowResolvedCredential:
      type: object
      required:
        - provider
        - credentialType
        - authMode
        - secret
        - ownerUserId
        - resolvedAt
      properties:
        provider:
          type: string
          enum: [ANTHROPIC]
        credentialType:
          type: string
          enum:
            - ANTHROPIC_API_KEY
            - ANTHROPIC_OAUTH
        authMode:
          type: string
          enum:
            - api-key
            - oauth-token
        secret:
          type: string
          description: Secret value returned only to authenticated workflows.
        ownerUserId:
          type: string
        resolvedAt:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string
        message:
          type:
            - string
            - 'null'
