openapi: 3.1.0
info:
  title: User AI Credentials API
  version: 1.0.0
  description: User settings endpoints for managing provider-scoped AI credentials.

servers:
  - url: http://localhost:3000
    description: Local development

paths:
  /api/settings/ai-credentials:
    get:
      summary: List current user's AI credentials
      description: Returns masked credential metadata only. Never returns secret values.
      operationId: listUserAiCredentials
      tags:
        - AI Credentials
      responses:
        '200':
          description: Masked credential summaries
          content:
            application/json:
              schema:
                type: object
                required: [credentials]
                properties:
                  credentials:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserAiCredentialSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/settings/ai-credentials/{provider}:
    put:
      summary: Create or replace the current user's credential for a provider
      description: Performs local/server validation and provider verification before marking the credential ready.
      operationId: upsertUserAiCredential
      tags:
        - AI Credentials
      parameters:
        - $ref: '#/components/parameters/Provider'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertUserAiCredentialRequest'
      responses:
        '200':
          description: Credential saved and verified
          content:
            application/json:
              schema:
                type: object
                required: [credential]
                properties:
                  credential:
                    $ref: '#/components/schemas/UserAiCredentialSummary'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Credential failed provider verification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_credential:
                  value:
                    error: Credential verification failed
                    code: CREDENTIAL_INVALID
                    message: Anthropic rejected the submitted credential. Check the token and try again.

    delete:
      summary: Delete the current user's provider credential
      description: Soft deletes the credential metadata and removes recoverable secret material.
      operationId: deleteUserAiCredential
      tags:
        - AI Credentials
      parameters:
        - $ref: '#/components/parameters/Provider'
      responses:
        '200':
          description: Credential deleted
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted:
                    type: boolean
                    const: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No active credential for provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing_credential:
                  value:
                    error: Credential not found
                    code: CREDENTIAL_NOT_FOUND

components:
  parameters:
    Provider:
      name: provider
      in: path
      required: true
      schema:
        type: string
        enum: [anthropic]

  responses:
    Unauthorized:
      description: User is not authenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthorized:
              value:
                error: Unauthorized
                code: AUTH_REQUIRED
    ValidationError:
      description: Request payload is invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            validation_error:
              value:
                error: Label is required
                code: VALIDATION_ERROR

  schemas:
    UpsertUserAiCredentialRequest:
      type: object
      required:
        - label
        - credentialType
        - secret
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 100
        credentialType:
          type: string
          enum:
            - ANTHROPIC_API_KEY
            - ANTHROPIC_OAUTH
        secret:
          type: string
          minLength: 1
          description: Plain secret submitted only at save time. Never returned by list/read APIs.

    UserAiCredentialSummary:
      type: object
      required:
        - provider
        - credentialType
        - label
        - maskedPreview
        - readinessStatus
        - updatedAt
      properties:
        provider:
          type: string
          enum: [ANTHROPIC]
        credentialType:
          type: string
          enum:
            - ANTHROPIC_API_KEY
            - ANTHROPIC_OAUTH
        label:
          type: string
        maskedPreview:
          type: string
          minLength: 4
          maxLength: 4
        readinessStatus:
          type: string
          enum:
            - PENDING_VERIFICATION
            - READY
            - ACTION_REQUIRED
        lastVerifiedAt:
          type:
            - string
            - 'null'
          format: date-time
        lastVerificationCode:
          type:
            - string
            - 'null'
        lastVerificationMessage:
          type:
            - string
            - 'null'
        updatedAt:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string
        message:
          type:
            - string
            - 'null'
