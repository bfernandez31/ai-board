version: 1

project:
  name: "AI Board"
  language: typescript
  framework: nextjs

runtime:
  manager: bun
  manager_version: "1.3.1"
  node: "22"

commands:
  install: bun install --frozen-lockfile
  build: bun run build
  lint: bun run lint
  type_check: bun run type-check
  test_unit: bun run test:unit
  test_integration: bun run test:integration
  test_e2e: bun run test:e2e
  db_setup: bunx prisma generate && if [ -n "${DATABASE_URL:-}" ]; then bunx prisma migrate deploy; fi
  db_seed: npx tsx tests/global-setup.ts

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_board_test
  NODE_ENV: test
  TEST_MODE: "true"

agent:
  cli: claude-code
  model: claude-opus-4-6
