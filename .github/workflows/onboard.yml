name: Project Onboard

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: Project ID
        required: true
        type: string
      job_id:
        description: Setup job ID
        required: true
        type: string
      githubRepository:
        description: Target repository in format owner/repo
        required: true
        type: string
      agent:
        description: Agent type (CLAUDE or CODEX)
        required: true
        type: string

env:
  API_BASE_URL: ${{ vars.API_BASE_URL || 'https://ai-board.vercel.app' }}

jobs:
  onboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PROJECT_ID: ${{ inputs.project_id }}
      JOB_ID: ${{ inputs.job_id }}
      TARGET_REPOSITORY: ${{ inputs.githubRepository }}
      SELECTED_AGENT: ${{ inputs.agent }}
      WORKFLOW_API_TOKEN: ${{ secrets.WORKFLOW_API_TOKEN }}
      APP_URL: ${{ vars.API_BASE_URL || 'https://ai-board.vercel.app' }}
    steps:
      - name: Checkout ai-board
        uses: actions/checkout@v5
        with:
          path: ai-board

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Install ai-board dependencies
        working-directory: ai-board
        run: bun install --frozen-lockfile

      - name: Report RUNNING
        working-directory: ai-board
        run: >
          bunx tsx .github/scripts/onboard/report-status.ts
          --project-id "${PROJECT_ID}"
          --job-id "${JOB_ID}"
          --base-url "${API_BASE_URL}"
          --status RUNNING
          --workflow-run-id "${{ github.run_id }}"

      - name: Resolve target default branch
        id: target-meta
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          DEFAULT_BRANCH=$(gh api "repos/${TARGET_REPOSITORY}" --jq .default_branch)
          echo "default_branch=${DEFAULT_BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Checkout target repository
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.githubRepository }}
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          path: target-repo
          ref: ${{ steps.target-meta.outputs.default_branch }}

      - name: Fetch owner credential
        id: credential
        run: |
          PROVIDER="ANTHROPIC"
          if [ "${SELECTED_AGENT}" = "CODEX" ]; then
            PROVIDER="OPENAI"
          fi

          curl -sf "${API_BASE_URL}/api/internal/credentials?projectId=${PROJECT_ID}&provider=${PROVIDER}" \
            -H "Authorization: Bearer ${WORKFLOW_API_TOKEN}" \
            -o credential.json

          ENV_VAR=$(jq -r '.envVar' credential.json)
          VALUE=$(jq -r '.value' credential.json)
          echo "::add-mask::${VALUE}"
          echo "${ENV_VAR}=${VALUE}" >> "$GITHUB_ENV"

      - name: Deterministic detection and config generation
        working-directory: ai-board
        run: >
          bunx tsx .github/scripts/onboard/detect-stack.ts
          --repo "../target-repo"
          --output-dir "../target-repo/.ai-board/onboarding"
          --agent "${SELECTED_AGENT}"
          --default-branch "${{ steps.target-meta.outputs.default_branch }}"

      - name: Generate repository guidance
        id: guidance
        working-directory: target-repo
        continue-on-error: true
        env:
          PROJECT_ID: ${{ inputs.project_id }}
        run: |
          mkdir -p .ai-board/onboarding/generated/.ai-board/memory
          ../ai-board/.github/scripts/run-agent.sh "${SELECTED_AGENT}" ai-board.onboard > .ai-board/onboarding/generated/CLAUDE.md
          cp .ai-board/onboarding/generated/CLAUDE.md .ai-board/onboarding/generated/AGENTS.md
          cat > .ai-board/onboarding/generated/.ai-board/memory/constitution.md <<'EOF'
          # Project Constitution

          Generated during onboarding. Review before applying broader project workflow changes.
          EOF

      - name: Assemble artifacts
        id: assemble
        working-directory: ai-board
        run: >
          bunx tsx .github/scripts/onboard/assemble-artifacts.ts
          --repo "../target-repo"
          --config-path "../target-repo/.ai-board/onboarding/config.yml"
          --analysis-path "../target-repo/.ai-board/onboarding/repository-analysis.json"
          --guidance-dir "../target-repo/.ai-board/onboarding/generated"
          --summary-path "../target-repo/.ai-board/onboarding/artifact-summary.json"
          ${{ steps.guidance.outcome == 'success' && '' || '--partial-reason Guidance generation failed after deterministic outputs succeeded' }}

      - name: Commit onboarding artifacts
        id: commit
        working-directory: target-repo
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "ai-board[bot]"
          git config user.email "ai-board[bot]@users.noreply.github.com"
          git add .ai-board/config.yml .ai-board/onboarding/repository-analysis.json CLAUDE.md AGENTS.md .ai-board/memory/constitution.md .ai-board/onboarding/artifact-summary.json || true
          if git diff --cached --quiet; then
            echo "sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: onboard project with AI Board artifacts"
          git push origin "HEAD:${{ steps.target-meta.outputs.default_branch }}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Report COMPLETED
        if: success()
        working-directory: ai-board
        run: >
          bunx tsx .github/scripts/onboard/report-status.ts
          --project-id "${PROJECT_ID}"
          --job-id "${JOB_ID}"
          --base-url "${API_BASE_URL}"
          --status COMPLETED
          --partial "${{ steps.guidance.outcome == 'success' && 'false' || 'true' }}"
          --commit-sha "${{ steps.commit.outputs.sha }}"
          --error-code "${{ steps.guidance.outcome == 'success' && '' || 'GUIDANCE_GENERATION_FAILED' }}"
          --artifact-summary-path "../target-repo/.ai-board/onboarding/artifact-summary.json"

      - name: Report FAILED
        if: failure()
        working-directory: ai-board
        run: >
          bunx tsx .github/scripts/onboard/report-status.ts
          --project-id "${PROJECT_ID}"
          --job-id "${JOB_ID}"
          --base-url "${API_BASE_URL}"
          --status FAILED
          --error-code "${{ steps.commit.conclusion == 'failure' && 'COMMIT_FAILED' || 'CONFIGURATION_GENERATION_FAILED' }}"
          --error-message "Onboarding workflow failed"
          --logs "Check workflow logs for failure details"
