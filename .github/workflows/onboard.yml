name: Project Onboard

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: 'Project ID'
        required: true
        type: string
      job_id:
        description: 'Setup job ID'
        required: true
        type: string
      githubRepository:
        description: 'Target repository in format owner/repo'
        required: true
        type: string
      agent:
        description: 'Agent type (CLAUDE or CODEX)'
        required: true
        type: string

env:
  APP_URL: ${{ vars.APP_URL || 'https://ai-board.vercel.app' }}
  WORKFLOW_API_TOKEN: ${{ secrets.WORKFLOW_API_TOKEN }}
  CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
  ANTHROPIC_MODEL: "claude-opus-4-6"
  # Claude Code telemetry
  CLAUDE_CODE_ENABLE_TELEMETRY: "1"
  OTEL_LOGS_EXPORTER: "otlp"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/json"
  OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.APP_URL }}/api/telemetry
  OTEL_EXPORTER_OTLP_HEADERS: "Authorization=Bearer ${{ secrets.WORKFLOW_API_TOKEN }}"
  OTEL_RESOURCE_ATTRIBUTES: "job_id=${{ inputs.job_id }}"
  OTEL_LOGS_EXPORT_INTERVAL: "60000"
  OTEL_BLRP_SCHEDULE_DELAY: "60000"

jobs:
  onboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      # ── Step 1: Report RUNNING ──────────────────────────────────────
      - name: Report RUNNING
        id: report-running
        run: |
          HTTP_CODE=$(curl -X PATCH \
            "${{ env.APP_URL }}/api/projects/${{ inputs.project_id }}/setup/jobs/${{ inputs.job_id }}/status" \
            -H "Authorization: Bearer ${{ env.WORKFLOW_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"status":"RUNNING","workflowRunId":${{ github.run_id }}}' \
            -s -o /dev/null -w "%{http_code}") || true
          if [ "$HTTP_CODE" = "409" ]; then
            echo "Job already CANCELLED — aborting workflow"
            echo "CANCELLED=true" >> "$GITHUB_ENV"
            exit 1
          elif [ "$HTTP_CODE" != "200" ]; then
            echo "Failed to update job status to RUNNING (HTTP $HTTP_CODE)"
          fi

      # ── Step 2: Fetch Owner AI Credential ───────────────────────────
      - name: Fetch Owner AI Credential
        id: fetch-credential
        run: |
          PROVIDER=$( [[ "${{ inputs.agent }}" == "CODEX" ]] && echo "OPENAI" || echo "ANTHROPIC" )
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            "${APP_URL}/api/internal/credentials?projectId=${{ inputs.project_id }}&provider=${PROVIDER}" \
            -H "Authorization: Bearer ${{ env.WORKFLOW_API_TOKEN }}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Failed to fetch owner credential (HTTP $HTTP_CODE)"
            echo "CREDENTIAL_FAILED=true" >> "$GITHUB_ENV"
            exit 1
          else
            CRED_TYPE=$(echo "$BODY" | jq -r '.credentialType')
            ENV_VAR=$(echo "$BODY" | jq -r '.envVar')
            CRED_VALUE_B64=$(echo "$BODY" | jq -r '.value')
            echo "::add-mask::${CRED_VALUE_B64}"
            CRED_VALUE=$(echo "$CRED_VALUE_B64" | base64 -d)
            echo "::add-mask::${CRED_VALUE}"

            {
              echo "${ENV_VAR}<<CREDENTIAL_EOF"
              echo "${CRED_VALUE}"
              echo "CREDENTIAL_EOF"
            } >> "$GITHUB_ENV"
            echo "Owner credential loaded (type: ${CRED_TYPE}, envVar: ${ENV_VAR})"
          fi
          echo "PROJECT_ID=${{ inputs.project_id }}" >> "$GITHUB_ENV"

      # ── Step 2b: Fetch Owner GitHub Token ───────────────────────────
      # Token is stored as a step OUTPUT (not GITHUB_ENV) so it is NOT
      # available as an environment variable in the Phase 2 LLM step.
      - name: Fetch Owner GitHub Token
        id: fetch-github-token
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            "${APP_URL}/api/internal/github-token?projectId=${{ inputs.project_id }}" \
            -H "Authorization: Bearer ${{ env.WORKFLOW_API_TOKEN }}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          if [ "$HTTP_CODE" = "200" ]; then
            TOKEN_B64=$(echo "$BODY" | jq -r '.token')
            echo "::add-mask::${TOKEN_B64}"
            OWNER_GH_TOKEN=$(echo "$TOKEN_B64" | base64 -d)
            echo "::add-mask::${OWNER_GH_TOKEN}"
            echo "repo_token=${OWNER_GH_TOKEN}" >> "$GITHUB_OUTPUT"
            echo "Owner GitHub token loaded"
          else
            echo "Owner GitHub token not available (HTTP $HTTP_CODE) — falling back to GH_PAT"
            echo "repo_token=${{ secrets.GH_PAT }}" >> "$GITHUB_OUTPUT"
          fi

      # ── Step 3: Checkout repos ──────────────────────────────────────
      - name: Checkout ai-board (sparse)
        uses: actions/checkout@v4
        with:
          path: ai-board
          sparse-checkout: |
            .claude-plugin
            .github/scripts
          sparse-checkout-cone-mode: true

      - name: Clone target repository
        id: clone-target
        env:
          REPO_TOKEN: ${{ steps.fetch-github-token.outputs.repo_token }}
        run: |
          echo "::add-mask::${REPO_TOKEN}"
          if ! git clone "https://x-access-token:${REPO_TOKEN}@github.com/${{ inputs.githubRepository }}.git" target-repo 2>&1; then
            echo "CLONE_FAILED=true" >> "$GITHUB_ENV"
            echo "Failed to clone target repository: ${{ inputs.githubRepository }}"
            exit 1
          fi
          cd target-repo
          # Strip embedded credentials from the remote URL after clone
          git remote set-url origin "https://github.com/${{ inputs.githubRepository }}.git"
          DEFAULT_BRANCH=$(git symbolic-ref refs/remotes/origin/HEAD 2>/dev/null | sed 's@^refs/remotes/origin/@@' || echo "main")
          echo "DEFAULT_BRANCH=${DEFAULT_BRANCH}" >> "$GITHUB_ENV"

      # ── Step 4: Phase 1 — Stack Detection ───────────────────────────
      - name: Phase 1 — Detect stack
        id: detect-stack
        run: |
          if ! bash ai-board/.github/scripts/detect-stack.sh target-repo "${{ inputs.agent }}"; then
            echo "DETECTION_FAILED=true" >> "$GITHUB_ENV"
            exit 1
          fi

      # ── Step 5: Configure Git ───────────────────────────────────────
      - name: Configure Git
        working-directory: target-repo
        run: |
          git config user.email "ai-board[bot]@users.noreply.github.com"
          git config user.name "ai-board[bot]"

      # ── Step 6: Setup tools for Phase 2 ─────────────────────────────
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'

      # ── Step 6b: Create plugin symlinks ─────────────────────────────
      - name: Create plugin symlinks
        working-directory: target-repo
        run: |
          mkdir -p .claude
          ln -sf ../../ai-board/.claude-plugin/commands .claude/commands
          ln -sf ../../ai-board/.claude-plugin/skills .claude/skills

      # ── Step 7: Phase 2 — LLM Content Generation ───────────────────
      - name: Phase 2 — Generate guidance files
        id: generate-guidance
        continue-on-error: true
        working-directory: target-repo
        run: |
          SKIP_CLAUDE_MD=""
          if [ -f "CLAUDE.md" ]; then
            SKIP_CLAUDE_MD="--skip-claude-md"
            echo "SKIP_CLAUDE_MD=true" >> "$GITHUB_ENV"
          fi

          bash ../ai-board/.github/scripts/run-agent.sh \
            "${{ inputs.agent }}" \
            "ai-board.onboard" \
            "--analysis-json=analysis.json ${SKIP_CLAUDE_MD}"

      - name: Check Phase 2 result
        run: |
          if [ "${{ steps.generate-guidance.outcome }}" = "failure" ]; then
            echo "PHASE2_FAILED=true" >> "$GITHUB_ENV"
            echo "Phase 2 (LLM generation) failed — proceeding with partial commit"
          fi

      # ── Step 8: Commit and Push ─────────────────────────────────────
      - name: Stage and commit files
        id: commit
        working-directory: target-repo
        env:
          # Re-inject token ONLY for this step (not available in LLM steps)
          REPO_TOKEN: ${{ steps.fetch-github-token.outputs.repo_token }}
        run: |
          echo "::add-mask::${REPO_TOKEN}"

          # Always stage Phase 1 outputs
          if ! git add .ai-board/config.yml; then
            echo "STAGE_FAILED=true" >> "$GITHUB_ENV"
            echo "Failed to stage .ai-board/config.yml"
            exit 1
          fi

          # Stage Phase 2 outputs if they exist
          git add .ai-board/memory/constitution.md 2>/dev/null || true
          git add CLAUDE.md 2>/dev/null || true
          git add AGENTS.md 2>/dev/null || true

          # Remove analysis.json if it exists (working artifact)
          rm -f analysis.json

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "NO_CHANGES=true" >> "$GITHUB_ENV"
          else
            git commit -m "chore: initialize ai-board configuration"
            # Set authenticated remote URL only for push, then strip it
            git remote set-url origin "https://x-access-token:${REPO_TOKEN}@github.com/${{ inputs.githubRepository }}.git"
            if ! git push origin "${DEFAULT_BRANCH}"; then
              git remote set-url origin "https://github.com/${{ inputs.githubRepository }}.git"
              echo "PUSH_FAILED=true" >> "$GITHUB_ENV"
              exit 1
            fi
            git remote set-url origin "https://github.com/${{ inputs.githubRepository }}.git"
            COMMIT_SHA=$(git rev-parse HEAD)
            echo "COMMIT_SHA=${COMMIT_SHA}" >> "$GITHUB_ENV"
          fi

      # ── Step 9: Build Artifact Summary and Report ───────────────────
      - name: Report COMPLETED
        if: success() || (failure() && env.PUSH_FAILED != 'true' && env.DETECTION_FAILED != 'true' && env.CLONE_FAILED != 'true' && env.CANCELLED != 'true' && env.CREDENTIAL_FAILED != 'true' && env.STAGE_FAILED != 'true')
        working-directory: target-repo
        run: |
          CREATED=()
          MISSING=()
          PRESERVED=()
          ERROR_CODE=""

          # Check config.yml
          if [ -f ".ai-board/config.yml" ]; then
            CREATED+=(".ai-board/config.yml")
          else
            MISSING+=(".ai-board/config.yml")
          fi

          # Check constitution.md
          if [ -f ".ai-board/memory/constitution.md" ]; then
            CREATED+=(".ai-board/memory/constitution.md")
          else
            MISSING+=(".ai-board/memory/constitution.md")
          fi

          # Check CLAUDE.md — created, preserved, or missing
          if [ "${SKIP_CLAUDE_MD:-}" = "true" ]; then
            PRESERVED+=("CLAUDE.md")
          elif [ -f "CLAUDE.md" ]; then
            CREATED+=("CLAUDE.md")
          else
            MISSING+=("CLAUDE.md")
          fi

          # Check AGENTS.md
          if [ -L "AGENTS.md" ] || [ -f "AGENTS.md" ]; then
            CREATED+=("AGENTS.md")
          else
            MISSING+=("AGENTS.md")
          fi

          # Determine partial status
          PARTIAL="false"
          if [ ${#MISSING[@]} -gt 0 ] && [ ${#CREATED[@]} -gt 0 ]; then
            PARTIAL="true"
            if [ "${PHASE2_FAILED:-}" = "true" ]; then
              ERROR_CODE="GUIDANCE_GENERATION_FAILED"
            fi
          fi

          # Build JSON arrays
          CREATED_JSON=$(printf '%s\n' "${CREATED[@]+"${CREATED[@]}"}" | jq -R . | jq -s .)
          MISSING_JSON=$(printf '%s\n' "${MISSING[@]+"${MISSING[@]}"}" | jq -R . | jq -s .)
          PRESERVED_JSON=$(printf '%s\n' "${PRESERVED[@]+"${PRESERVED[@]}"}" | jq -R . | jq -s .)

          # Remove empty string from arrays if no items
          if [ ${#CREATED[@]} -eq 0 ]; then CREATED_JSON="[]"; fi
          if [ ${#MISSING[@]} -eq 0 ]; then MISSING_JSON="[]"; fi
          if [ ${#PRESERVED[@]} -eq 0 ]; then PRESERVED_JSON="[]"; fi

          # Build artifact summary
          ARTIFACT_SUMMARY=$(jq -n \
            --argjson partial "$PARTIAL" \
            --arg commitSha "${COMMIT_SHA:-}" \
            --argjson created "$CREATED_JSON" \
            --argjson missing "$MISSING_JSON" \
            --argjson preserved "$PRESERVED_JSON" \
            --arg errorCode "$ERROR_CODE" \
            '{
              partial: $partial,
              created: $created,
              missing: $missing,
              preserved: $preserved
            }
            + (if $commitSha != "" then {commitSha: $commitSha} else {} end)
            + (if $errorCode != "" then {errorCode: $errorCode} else {} end)')

          # Report COMPLETED
          curl -sf -X PATCH \
            "${{ env.APP_URL }}/api/projects/${{ inputs.project_id }}/setup/jobs/${{ inputs.job_id }}/status" \
            -H "Authorization: Bearer ${{ env.WORKFLOW_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --argjson summary "$ARTIFACT_SUMMARY" '{"status":"COMPLETED","artifactSummary":$summary}')" || true

      # ── Error Handlers ──────────────────────────────────────────────
      - name: Report FAILED — Clone failed
        if: failure() && env.CLONE_FAILED == 'true'
        run: |
          curl -sf -X PATCH \
            "${{ env.APP_URL }}/api/projects/${{ inputs.project_id }}/setup/jobs/${{ inputs.job_id }}/status" \
            -H "Authorization: Bearer ${{ env.WORKFLOW_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"status":"FAILED","errorMessage":"Failed to clone target repository: ${{ inputs.githubRepository }}","artifactSummary":{"errorCode":"DISPATCH_FAILED","created":[],"missing":[".ai-board/config.yml","CLAUDE.md",".ai-board/memory/constitution.md","AGENTS.md"]}}' || true

      - name: Report FAILED — Detection failed
        if: failure() && env.DETECTION_FAILED == 'true'
        run: |
          curl -sf -X PATCH \
            "${{ env.APP_URL }}/api/projects/${{ inputs.project_id }}/setup/jobs/${{ inputs.job_id }}/status" \
            -H "Authorization: Bearer ${{ env.WORKFLOW_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"status":"FAILED","errorMessage":"Stack detection failed","artifactSummary":{"errorCode":"CONFIG_GENERATION_FAILED","created":[],"missing":[".ai-board/config.yml","CLAUDE.md",".ai-board/memory/constitution.md","AGENTS.md"]}}' || true

      - name: Report FAILED — Push failed
        if: failure() && env.PUSH_FAILED == 'true'
        run: |
          curl -sf -X PATCH \
            "${{ env.APP_URL }}/api/projects/${{ inputs.project_id }}/setup/jobs/${{ inputs.job_id }}/status" \
            -H "Authorization: Bearer ${{ env.WORKFLOW_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"status":"FAILED","errorMessage":"Failed to push commit to target repository","artifactSummary":{"errorCode":"COMMIT_FAILED","created":[],"missing":[".ai-board/config.yml","CLAUDE.md",".ai-board/memory/constitution.md","AGENTS.md"]}}' || true

      - name: Report FAILED — Credential fetch failed
        if: failure() && env.CREDENTIAL_FAILED == 'true'
        run: |
          curl -sf -X PATCH \
            "${{ env.APP_URL }}/api/projects/${{ inputs.project_id }}/setup/jobs/${{ inputs.job_id }}/status" \
            -H "Authorization: Bearer ${{ env.WORKFLOW_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"status":"FAILED","errorMessage":"Failed to fetch owner AI credential","artifactSummary":{"errorCode":"DISPATCH_FAILED","created":[],"missing":[".ai-board/config.yml","CLAUDE.md",".ai-board/memory/constitution.md","AGENTS.md"]}}' || true

      - name: Report FAILED — Staging failed
        if: failure() && env.STAGE_FAILED == 'true'
        run: |
          curl -sf -X PATCH \
            "${{ env.APP_URL }}/api/projects/${{ inputs.project_id }}/setup/jobs/${{ inputs.job_id }}/status" \
            -H "Authorization: Bearer ${{ env.WORKFLOW_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"status":"FAILED","errorMessage":"Failed to stage generated files for commit","artifactSummary":{"errorCode":"COMMIT_FAILED","created":[],"missing":[".ai-board/config.yml","CLAUDE.md",".ai-board/memory/constitution.md","AGENTS.md"]}}' || true

      - name: Report FAILED — Catch-all
        if: failure() && env.CLONE_FAILED != 'true' && env.DETECTION_FAILED != 'true' && env.PUSH_FAILED != 'true' && env.CANCELLED != 'true' && env.CREDENTIAL_FAILED != 'true' && env.STAGE_FAILED != 'true'
        run: |
          curl -sf -X PATCH \
            "${{ env.APP_URL }}/api/projects/${{ inputs.project_id }}/setup/jobs/${{ inputs.job_id }}/status" \
            -H "Authorization: Bearer ${{ env.WORKFLOW_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"status":"FAILED","errorMessage":"Onboard workflow failed unexpectedly"}' || true

      - name: Report FAILED — Cancelled
        if: cancelled()
        run: |
          curl -sf -X PATCH \
            "${{ env.APP_URL }}/api/projects/${{ inputs.project_id }}/setup/jobs/${{ inputs.job_id }}/status" \
            -H "Authorization: Bearer ${{ env.WORKFLOW_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"status":"FAILED","errorMessage":"Onboard workflow was cancelled"}' || true
