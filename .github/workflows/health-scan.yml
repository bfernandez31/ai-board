name: Health Scan Execution

on:
  workflow_dispatch:
    inputs:
      scan_id:
        description: 'Health scan record ID'
        required: true
        type: string
      project_id:
        description: 'Project ID'
        required: true
        type: string
      scan_type:
        description: 'Scan type (SECURITY|COMPLIANCE|TESTS|SPEC_SYNC)'
        required: true
        type: string
      base_commit:
        description: 'Base commit SHA for incremental scan (empty for full scan)'
        required: false
        type: string
        default: ''
      head_commit:
        description: 'Head commit SHA (empty to use current HEAD)'
        required: false
        type: string
        default: ''
      githubRepository:
        description: 'Target repository in format owner/repo'
        required: true
        type: string
      agent:
        description: 'Agent type (CLAUDE or CODEX)'
        required: false
        type: string
        default: 'CLAUDE'

jobs:
  run-health-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # PostgreSQL service container for TESTS scan type (idle for other scan types)
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_board_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_board_test
      APP_URL: ${{ vars.APP_URL }}
      WORKFLOW_API_TOKEN: ${{ secrets.WORKFLOW_API_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_MODEL: "claude-opus-4-6"
      # Inputs passed as env vars to prevent script injection (shell metacharacters
      # in workflow_dispatch values would be interpolated into run: scripts).
      INPUT_SCAN_ID: ${{ inputs.scan_id }}
      INPUT_PROJECT_ID: ${{ inputs.project_id }}
      INPUT_SCAN_TYPE: ${{ inputs.scan_type }}
      INPUT_BASE_COMMIT: ${{ inputs.base_commit }}
      INPUT_HEAD_COMMIT: ${{ inputs.head_commit }}
      INPUT_GITHUB_REPOSITORY: ${{ inputs.githubRepository }}
      INPUT_AGENT: ${{ inputs.agent }}

    steps:
      - name: Debug Inputs
        run: |
          echo "🔍 Health scan inputs:"
          echo "  scan_id: $INPUT_SCAN_ID"
          echo "  project_id: $INPUT_PROJECT_ID"
          echo "  scan_type: $INPUT_SCAN_TYPE"
          echo "  base_commit: $INPUT_BASE_COMMIT"
          echo "  head_commit: $INPUT_HEAD_COMMIT"
          echo "  githubRepository: $INPUT_GITHUB_REPOSITORY"

      # Checkout ai-board for commands and scripts (sparse, from main = stable tools)
      - name: Checkout ai-board (sparse - plugin and scripts)
        uses: actions/checkout@v4
        with:
          path: ai-board
          sparse-checkout: |
            .claude-plugin
            .github/scripts
          sparse-checkout-cone-mode: true

      # Step 1: Checkout target repository (US1 T006)
      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.githubRepository }}
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0
          path: target

      # Step 2: Update scan status to RUNNING (US1 T007)
      - name: Update Scan Status - RUNNING
        run: |
          curl -X PATCH "${APP_URL}/api/projects/${INPUT_PROJECT_ID}/health/scans/${INPUT_SCAN_ID}/status" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${WORKFLOW_API_TOKEN}" \
            -d '{"status": "RUNNING"}' \
            -f -s -S || echo "⚠️ Failed to update scan status to RUNNING"

      # Step 3: Map scan type to command (US1 T008) — static mapping, no dynamic construction (FR-013)
      - name: Map Scan Type to Command
        id: scan-command
        run: |
          case "$INPUT_SCAN_TYPE" in
            SECURITY)
              echo "command=health-security" >> $GITHUB_OUTPUT
              ;;
            COMPLIANCE)
              echo "command=health-compliance" >> $GITHUB_OUTPUT
              ;;
            TESTS)
              echo "command=health-tests" >> $GITHUB_OUTPUT
              ;;
            SPEC_SYNC)
              echo "command=health-spec-sync" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "❌ Unknown scan type: $INPUT_SCAN_TYPE"
              exit 1
              ;;
          esac
          echo "✅ Mapped $INPUT_SCAN_TYPE → ai-board.$(grep command <<< "$(cat $GITHUB_OUTPUT)" | cut -d= -f2)"

      - name: Setup ai-board commands and skills
        run: |
          mkdir -p target/.claude
          ln -sf ../../ai-board/.claude-plugin/commands target/.claude/commands
          ln -sf ../../ai-board/.claude-plugin/skills target/.claude/skills
          echo "✅ ai-board commands linked to target/.claude/commands"
          echo "✅ ai-board skills linked to target/.claude/skills"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      # --- Test infrastructure setup (only for TESTS scan type) ---
      - name: Install Dependencies
        if: ${{ inputs.scan_type == 'TESTS' }}
        working-directory: target
        run: bun install --frozen-lockfile

      - name: Setup Test Environment
        if: ${{ inputs.scan_type == 'TESTS' }}
        working-directory: target
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          echo "🔧 Setting up test environment for health scan..."
          ../ai-board/.github/scripts/setup-test-env.sh

      - name: Detect Prisma
        if: ${{ inputs.scan_type == 'TESTS' }}
        id: detect-prisma
        working-directory: target
        run: |
          if [ -f "prisma/schema.prisma" ]; then
            echo "has_prisma=true" >> $GITHUB_OUTPUT
          else
            echo "has_prisma=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate Prisma Client
        if: ${{ inputs.scan_type == 'TESTS' && steps.detect-prisma.outputs.has_prisma == 'true' }}
        working-directory: target
        run: npx prisma generate

      - name: Apply Database Migrations
        if: ${{ inputs.scan_type == 'TESTS' && steps.detect-prisma.outputs.has_prisma == 'true' }}
        working-directory: target
        run: npx prisma migrate deploy

      - name: Seed Test Database
        if: ${{ inputs.scan_type == 'TESTS' && steps.detect-prisma.outputs.has_prisma == 'true' }}
        working-directory: target
        run: |
          if [ -f "tests/global-setup.ts" ]; then
            npx tsx tests/global-setup.ts
          else
            echo "ℹ️ No tests/global-setup.ts found, skipping seed"
          fi

      - name: Get Playwright Version
        if: ${{ inputs.scan_type == 'TESTS' }}
        working-directory: target
        id: playwright-version
        run: |
          if [ -f "package.json" ] && node -p "require('./package.json').devDependencies['@playwright/test']" 2>/dev/null; then
            echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> $GITHUB_OUTPUT
            echo "has_playwright=true" >> $GITHUB_OUTPUT
          else
            echo "has_playwright=false" >> $GITHUB_OUTPUT
          fi

      - name: Cache Playwright Browsers
        if: ${{ inputs.scan_type == 'TESTS' && steps.playwright-version.outputs.has_playwright == 'true' }}
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Browsers
        if: ${{ inputs.scan_type == 'TESTS' && steps.playwright-version.outputs.has_playwright == 'true' && steps.playwright-cache.outputs.cache-hit != 'true' }}
        working-directory: target
        run: npx playwright install chromium

      # Step 4: Execute scan command (US1 T009, US3 T015, US6 T021)
      - name: Execute Scan Command
        id: scan-exec
        working-directory: target
        env:
          SCAN_CMD: ${{ steps.scan-command.outputs.command }}
        run: |
          BASE_COMMIT="$INPUT_BASE_COMMIT"
          HEAD_COMMIT="$INPUT_HEAD_COMMIT"

          # Build command arguments (US3: incremental vs full scan)
          SCAN_ARGS=""
          if [ -n "$BASE_COMMIT" ]; then
            SCAN_ARGS="--base-commit $BASE_COMMIT"
          fi
          if [ -n "$HEAD_COMMIT" ]; then
            SCAN_ARGS="$SCAN_ARGS --head-commit $HEAD_COMMIT"
          fi

          echo "🔍 Running scan: $SCAN_CMD $SCAN_ARGS"

          # Track duration (US6: telemetry)
          SECONDS=0

          # Execute scan via run-agent.sh (standard interactive mode)
          # The skill writes results to /tmp/health-scan-result.json (file-based output, like compare skill)
          if ../ai-board/.github/scripts/run-agent.sh "$INPUT_AGENT" "ai-board.${SCAN_CMD}" "${SCAN_ARGS}" 2>&1 | tee /tmp/scan_log.txt; then
            DURATION_MS=$((SECONDS * 1000))
            echo "duration_ms=$DURATION_MS" >> $GITHUB_OUTPUT

            # Read results from file written by the skill
            RESULT_FILE="/tmp/health-scan-result.json"
            if [ -f "$RESULT_FILE" ] && jq empty "$RESULT_FILE" 2>/dev/null; then
              echo "scan_success=true" >> $GITHUB_OUTPUT

              SCORE=$(jq -r '.score // 0' "$RESULT_FILE")
              ISSUES_FOUND=$(jq -r '.issuesFound // 0' "$RESULT_FILE")
              ISSUES_FIXED=$(jq -r '.issuesFixed // 0' "$RESULT_FILE")
              REPORT=$(jq -c '.report // {}' "$RESULT_FILE")
              TOKENS_USED=$(jq -r '.tokensUsed // empty' "$RESULT_FILE")
              COST_USD=$(jq -r '.costUsd // empty' "$RESULT_FILE")

              echo "score=$SCORE" >> $GITHUB_OUTPUT
              echo "issues_found=$ISSUES_FOUND" >> $GITHUB_OUTPUT
              echo "issues_fixed=$ISSUES_FIXED" >> $GITHUB_OUTPUT
              echo "tokens_used=$TOKENS_USED" >> $GITHUB_OUTPUT
              echo "cost_usd=$COST_USD" >> $GITHUB_OUTPUT

              # Store report in file (may be large)
              echo "$REPORT" > /tmp/scan_report.json

              echo "✅ Scan completed: score=$SCORE, issues=$ISSUES_FOUND"
            else
              echo "scan_success=false" >> $GITHUB_OUTPUT
              echo "error_msg<<EOF_ERROR" >> $GITHUB_OUTPUT
              echo "Skill did not write /tmp/health-scan-result.json or file is not valid JSON" >> $GITHUB_OUTPUT
              echo "EOF_ERROR" >> $GITHUB_OUTPUT
              echo "❌ Scan agent succeeded but result file missing or invalid"
            fi
          else
            DURATION_MS=$((SECONDS * 1000))
            echo "duration_ms=$DURATION_MS" >> $GITHUB_OUTPUT
            echo "scan_success=false" >> $GITHUB_OUTPUT

            # Capture error from log
            ERROR_MSG=$(tail -c 2000 /tmp/scan_log.txt)
            echo "error_msg<<EOF_ERROR" >> $GITHUB_OUTPUT
            echo "$ERROR_MSG" >> $GITHUB_OUTPUT
            echo "EOF_ERROR" >> $GITHUB_OUTPUT

            echo "❌ Scan failed"
          fi

      # Step 5: Create remediation tickets from scan results (US2 T013)
      # NOTE: Tickets are created BEFORE marking COMPLETED per spec (integrations.md)
      - name: Create Remediation Tickets
        if: ${{ steps.scan-exec.outputs.scan_success == 'true' && steps.scan-exec.outputs.issues_found > 0 }}
        run: |
          SCAN_TYPE="$INPUT_SCAN_TYPE"
          REPORT_FILE="/tmp/scan_report.json"

          # Parse report and create grouped tickets based on scan type
          # NOTE: Pipe file directly to jq — never use echo "$VAR" with JSON that
          #       may contain backticks (bash interprets them as command substitution).
          case "$SCAN_TYPE" in
            SECURITY)
              # Group by severity — include exploit scenario & recommendation when available
              jq -c '.issues // [] | group_by(.severity) | .[] | {
                severity: .[0].severity,
                count: length,
                details: [.[] | "- **\(.file // "unknown"):\(.line // "?")**: \(.description)" + (if .exploitScenario then "\n  > **Exploit:** \(.exploitScenario)" else "" end) + (if .recommendation then "\n  > **Fix:** \(.recommendation)" else "" end)] | join("\n\n")
              }' "$REPORT_FILE" | while read -r group; do
                SEVERITY=$(printf '%s' "$group" | jq -r '.severity')
                COUNT=$(printf '%s' "$group" | jq -r '.count')
                DETAILS=$(printf '%s' "$group" | jq -r '.details')
                SUFFIX=""; [ "$COUNT" -gt 1 ] && SUFFIX="s"
                TITLE="[Security] Fix ${COUNT} ${SEVERITY^^} severity issue${SUFFIX}"
                DESC=$(printf 'Health scan found %s %s severity security issue%s:\n\n%s' "$COUNT" "${SEVERITY^^}" "$SUFFIX" "$DETAILS" | head -c 9900)

                curl -X POST "${APP_URL}/api/projects/${INPUT_PROJECT_ID}/tickets" \
                  -H "Content-Type: application/json" \
                  -H "Authorization: Bearer ${WORKFLOW_API_TOKEN}" \
                  -d "$(jq -n --arg t "$TITLE" --arg d "$DESC" '{title: $t, description: $d, stage: "INBOX", workflowType: "QUICK"}')" \
                  -f -s -S || echo "⚠️ Failed to create ticket: $TITLE"
              done
              ;;
            COMPLIANCE)
              # Group by category/principle
              jq -c '.issues // [] | [.[] | .category //= "General" | .file //= "unknown" | .line //= "?"] | group_by(.category) | .[] | {
                category: .[0].category,
                count: length,
                details: ([.[] | "\(.file):\(.line): \(.description)"] | join("\n"))
              }' "$REPORT_FILE" | while read -r group; do
                CATEGORY=$(printf '%s' "$group" | jq -r '.category')
                COUNT=$(printf '%s' "$group" | jq -r '.count')
                DETAILS=$(printf '%s' "$group" | jq -r '.details')
                SUFFIX=""; [ "$COUNT" -gt 1 ] && SUFFIX="s"
                TITLE="[Compliance] Fix ${COUNT} violation${SUFFIX} - ${CATEGORY}"
                DESC=$(printf 'Health scan found %s compliance violation%s for principle "%s":\n\n%s' "$COUNT" "$SUFFIX" "$CATEGORY" "$DETAILS")

                curl -X POST "${APP_URL}/api/projects/${INPUT_PROJECT_ID}/tickets" \
                  -H "Content-Type: application/json" \
                  -H "Authorization: Bearer ${WORKFLOW_API_TOKEN}" \
                  -d "$(jq -n --arg t "$TITLE" --arg d "$DESC" '{title: $t, description: $d, stage: "INBOX", workflowType: "QUICK"}')" \
                  -f -s -S || echo "⚠️ Failed to create ticket: $TITLE"
              done
              ;;
            TESTS)
              # One ticket per non-fixable test
              jq -c '.nonFixable // [] | .[]' "$REPORT_FILE" | while read -r issue; do
                DESC_TEXT=$(printf '%s' "$issue" | jq -r '.description')
                FILE=$(printf '%s' "$issue" | jq -r '.file // "Unknown"')
                TITLE="[Tests] Fix failing test: $(printf '%s' "$DESC_TEXT" | head -c 80)"
                DESC=$(printf 'Health scan found a non-fixable test failure:\n\n- **Test**: %s\n- **File**: %s' "$DESC_TEXT" "$FILE")

                curl -X POST "${APP_URL}/api/projects/${INPUT_PROJECT_ID}/tickets" \
                  -H "Content-Type: application/json" \
                  -H "Authorization: Bearer ${WORKFLOW_API_TOKEN}" \
                  -d "$(jq -n --arg t "$TITLE" --arg d "$DESC" '{title: $t, description: $d, stage: "INBOX", workflowType: "QUICK"}')" \
                  -f -s -S || echo "⚠️ Failed to create ticket: $TITLE"
              done
              ;;
            SPEC_SYNC)
              # One ticket per drifted spec
              jq -c '.specs // [] | .[] | select(.status == "drifted")' "$REPORT_FILE" | while read -r spec; do
                SPEC_PATH=$(printf '%s' "$spec" | jq -r '.specPath')
                DRIFT=$(printf '%s' "$spec" | jq -r '.drift // "Specification out of sync with implementation"')
                SHORT_NAME=$(echo "$SPEC_PATH" | sed 's|^specs/specifications/||; s|\.md$||')
                TITLE="[Spec Sync] ${SHORT_NAME}"
                DESC=$(printf 'Health scan detected spec drift:\n\n- **Spec**: %s\n- **Drift**: %s' "$SPEC_PATH" "$DRIFT")

                curl -X POST "${APP_URL}/api/projects/${INPUT_PROJECT_ID}/tickets" \
                  -H "Content-Type: application/json" \
                  -H "Authorization: Bearer ${WORKFLOW_API_TOKEN}" \
                  -d "$(jq -n --arg t "$TITLE" --arg d "$DESC" '{title: $t, description: $d, stage: "INBOX", workflowType: "QUICK"}')" \
                  -f -s -S || echo "⚠️ Failed to create ticket: $TITLE"
              done
              ;;
          esac

          echo "✅ Remediation tickets created"

      # Step 6: Update status to COMPLETED with results (US1 T010, US4 T017, US6 T021)
      # NOTE: Runs AFTER ticket creation per spec (integrations.md)
      - name: Update Scan Status - COMPLETED
        if: ${{ steps.scan-exec.outputs.scan_success == 'true' }}
        working-directory: target
        env:
          SCAN_SCORE: ${{ steps.scan-exec.outputs.score }}
          SCAN_ISSUES_FOUND: ${{ steps.scan-exec.outputs.issues_found }}
          SCAN_ISSUES_FIXED: ${{ steps.scan-exec.outputs.issues_fixed }}
          SCAN_DURATION_MS: ${{ steps.scan-exec.outputs.duration_ms }}
          SCAN_TOKENS_USED: ${{ steps.scan-exec.outputs.tokens_used }}
          SCAN_COST_USD: ${{ steps.scan-exec.outputs.cost_usd }}
        run: |
          HEAD_COMMIT="$INPUT_HEAD_COMMIT"

          # If no head_commit provided, use current HEAD
          if [ -z "$HEAD_COMMIT" ]; then
            HEAD_COMMIT=$(git rev-parse HEAD)
          fi

          # Build payload with telemetry (US6)
          # Use --rawfile to load report without bash variable expansion (avoids
          # backtick command substitution in JSON values like `$queryRaw`).
          PAYLOAD=$(jq -n \
            --arg status "COMPLETED" \
            --argjson score "$SCAN_SCORE" \
            --rawfile report /tmp/scan_report.json \
            --argjson issuesFound "$SCAN_ISSUES_FOUND" \
            --argjson issuesFixed "$SCAN_ISSUES_FIXED" \
            --arg headCommit "$HEAD_COMMIT" \
            --argjson durationMs "$SCAN_DURATION_MS" \
            '{
              status: $status,
              score: $score,
              report: $report,
              issuesFound: $issuesFound,
              issuesFixed: $issuesFixed,
              headCommit: $headCommit,
              durationMs: $durationMs
            }')

          # Add optional telemetry fields
          TOKENS="$SCAN_TOKENS_USED"
          COST="$SCAN_COST_USD"
          if [ -n "$TOKENS" ]; then
            PAYLOAD=$(printf '%s' "$PAYLOAD" | jq --argjson t "$TOKENS" '. + {tokensUsed: $t}')
          fi
          if [ -n "$COST" ]; then
            PAYLOAD=$(printf '%s' "$PAYLOAD" | jq --argjson c "$COST" '. + {costUsd: $c}')
          fi

          curl -X PATCH "${APP_URL}/api/projects/${INPUT_PROJECT_ID}/health/scans/${INPUT_SCAN_ID}/status" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${WORKFLOW_API_TOKEN}" \
            -d "$PAYLOAD" \
            -f -s -S

          echo "✅ Scan status updated to COMPLETED (score: $SCAN_SCORE)"

      # Error handling: Update status to FAILED (US5 T019)
      # Catch-all: runs whenever COMPLETED step was skipped (covers explicit failure AND unexpected crashes)
      - name: Update Scan Status - FAILED
        if: ${{ always() && steps.scan-exec.outputs.scan_success != 'true' }}
        env:
          SCAN_ERROR_MSG: ${{ steps.scan-exec.outputs.error_msg }}
          SCAN_DURATION_MS: ${{ steps.scan-exec.outputs.duration_ms }}
        run: |
          ERROR_MSG="$SCAN_ERROR_MSG"
          if [ -z "$ERROR_MSG" ]; then
            ERROR_MSG="Workflow step failed — check GitHub Actions logs"
          fi

          # Truncate to 2000 chars
          ERROR_MSG=$(echo "$ERROR_MSG" | head -c 2000)

          DURATION_MS="$SCAN_DURATION_MS"
          DURATION_MS="${DURATION_MS:-0}"

          PAYLOAD=$(jq -n \
            --arg status "FAILED" \
            --arg errorMessage "$ERROR_MSG" \
            --argjson durationMs "$DURATION_MS" \
            '{status: $status, errorMessage: $errorMessage, durationMs: $durationMs}')

          curl -X PATCH "${APP_URL}/api/projects/${INPUT_PROJECT_ID}/health/scans/${INPUT_SCAN_ID}/status" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${WORKFLOW_API_TOKEN}" \
            -d "$PAYLOAD" \
            -f -s -S || echo "⚠️ Failed to update scan status to FAILED"

          echo "❌ Scan marked as FAILED"

      - name: Report Success
        if: ${{ steps.scan-exec.outputs.scan_success == 'true' }}
        env:
          SCAN_SCORE: ${{ steps.scan-exec.outputs.score }}
          SCAN_ISSUES_FOUND: ${{ steps.scan-exec.outputs.issues_found }}
          SCAN_ISSUES_FIXED: ${{ steps.scan-exec.outputs.issues_fixed }}
          SCAN_DURATION_MS: ${{ steps.scan-exec.outputs.duration_ms }}
        run: |
          echo "✅ Health scan completed successfully"
          echo "  Type: $INPUT_SCAN_TYPE"
          echo "  Score: $SCAN_SCORE"
          echo "  Issues: $SCAN_ISSUES_FOUND found, $SCAN_ISSUES_FIXED fixed"
          echo "  Duration: ${SCAN_DURATION_MS}ms"
