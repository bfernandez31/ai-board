name: Backfill Ticket Outcomes

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: 'Project ID to backfill'
        required: true
        type: string
      resume_cursor:
        description: 'Resume from this Ticket.id (lower bound, exclusive)'
        required: false
        type: string

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      APP_URL: ${{ vars.APP_URL || 'https://ai-board.vercel.app' }}
      WORKFLOW_API_TOKEN: ${{ secrets.WORKFLOW_API_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GITHUB_TOKEN: ${{ secrets.GH_PAT }}

    steps:
      - name: Checkout ai-board
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Run backfill script
        run: |
          if [ -n "${{ inputs.resume_cursor }}" ]; then
            bun run scripts/backfill-outcomes.ts \
              --project-id ${{ inputs.project_id }} \
              --resume-cursor ${{ inputs.resume_cursor }}
          else
            bun run scripts/backfill-outcomes.ts \
              --project-id ${{ inputs.project_id }}
          fi
