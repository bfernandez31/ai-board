name: Retro-Spec Generate

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: 'Project ID'
        required: true
        type: string
      job_id:
        description: 'Setup job ID (command=RETRO_SPEC)'
        required: true
        type: string
      githubRepository:
        description: 'Target repository in format owner/repo'
        required: true
        type: string
      agent:
        description: 'Agent type (CLAUDE, CODEX, or MISTRAL)'
        required: true
        type: string
      depth:
        description: 'Spec depth: QUICK, STANDARD, or COMPREHENSIVE'
        required: true
        type: string
      docUrl:
        description: 'Optional external documentation URL'
        required: false
        type: string
        default: ''
      context:
        description: 'Optional additional context from user'
        required: false
        type: string
        default: ''

env:
  APP_URL: ${{ vars.APP_URL || 'https://ai-board.vercel.app' }}
  WORKFLOW_API_TOKEN: ${{ secrets.WORKFLOW_API_TOKEN }}
  CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
  ANTHROPIC_MODEL: "claude-opus-4-8"
  # Claude Code telemetry — disabled until ProjectSetupJob supports telemetry fields
  CLAUDE_CODE_ENABLE_TELEMETRY: "0"

jobs:
  retro-spec:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write

    steps:
      # ── Step 1: Report RUNNING ──────────────────────────────────────
      - name: Report RUNNING
        id: report-running
        run: |
          HTTP_CODE=$(curl -X PATCH \
            "${{ env.APP_URL }}/api/projects/${{ inputs.project_id }}/setup/jobs/${{ inputs.job_id }}/status" \
            -H "Authorization: Bearer ${{ env.WORKFLOW_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"status":"RUNNING","workflowRunId":${{ github.run_id }}}' \
            -s -o /dev/null -w "%{http_code}") || true
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Failed to update job status to RUNNING (HTTP $HTTP_CODE)"
          fi

      # ── Step 2: Fetch Owner AI Credential ───────────────────────────
      - name: Fetch Owner AI Credential
        id: fetch-credential
        run: |
          if [[ "${{ inputs.agent }}" == "GEMINI" ]]; then
            echo "Gemini is not supported for retro-spec workflows"
            exit 1
          elif [[ "${{ inputs.agent }}" == "CODEX" ]]; then
            PROVIDER="OPENAI"
          elif [[ "${{ inputs.agent }}" == "MISTRAL" ]]; then
            PROVIDER="MISTRAL"
          else
            PROVIDER="ANTHROPIC"
          fi
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            "${APP_URL}/api/internal/credentials?projectId=${{ inputs.project_id }}&provider=${PROVIDER}" \
            -H "Authorization: Bearer ${{ env.WORKFLOW_API_TOKEN }}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Failed to fetch owner credential (HTTP $HTTP_CODE)"
            echo "CREDENTIAL_FAILED=true" >> "$GITHUB_ENV"
            exit 1
          else
            CRED_TYPE=$(echo "$BODY" | jq -r '.credentialType')
            ENV_VAR=$(echo "$BODY" | jq -r '.envVar')
            CRED_VALUE_B64=$(echo "$BODY" | jq -r '.value')
            echo "::add-mask::${CRED_VALUE_B64}"
            CRED_VALUE=$(echo "$CRED_VALUE_B64" | base64 -d)
            echo "::add-mask::${CRED_VALUE}"

            {
              echo "${ENV_VAR}<<CREDENTIAL_EOF"
              echo "${CRED_VALUE}"
              echo "CREDENTIAL_EOF"
            } >> "$GITHUB_ENV"
            echo "Owner credential loaded (type: ${CRED_TYPE}, envVar: ${ENV_VAR})"
          fi
          echo "PROJECT_ID=${{ inputs.project_id }}" >> "$GITHUB_ENV"

      # ── Step 2b: Fetch Owner GitHub Token ───────────────────────────
      - name: Fetch Owner GitHub Token
        id: fetch-github-token
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            "${APP_URL}/api/internal/github-token?projectId=${{ inputs.project_id }}" \
            -H "Authorization: Bearer ${{ env.WORKFLOW_API_TOKEN }}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          if [ "$HTTP_CODE" = "200" ]; then
            TOKEN_B64=$(echo "$BODY" | jq -r '.token')
            echo "::add-mask::${TOKEN_B64}"
            OWNER_GH_TOKEN=$(echo "$TOKEN_B64" | base64 -d)
            echo "::add-mask::${OWNER_GH_TOKEN}"
            echo "repo_token=${OWNER_GH_TOKEN}" >> "$GITHUB_OUTPUT"
            echo "Owner GitHub token loaded"
          else
            echo "Owner GitHub token not available (HTTP $HTTP_CODE) — falling back to GH_PAT"
            echo "repo_token=${{ secrets.GH_PAT }}" >> "$GITHUB_OUTPUT"
          fi

      # ── Step 3: Checkout repos ──────────────────────────────────────
      - name: Checkout ai-board (sparse)
        uses: actions/checkout@v4
        with:
          path: ai-board
          sparse-checkout: |
            .claude-plugin
            .github/scripts
          sparse-checkout-cone-mode: true

      - name: Clone target repository
        id: clone-target
        env:
          REPO_TOKEN: ${{ steps.fetch-github-token.outputs.repo_token }}
        run: |
          echo "::add-mask::${REPO_TOKEN}"
          if ! git clone "https://x-access-token:${REPO_TOKEN}@github.com/${{ inputs.githubRepository }}.git" target-repo 2>&1; then
            echo "CLONE_FAILED=true" >> "$GITHUB_ENV"
            echo "Failed to clone target repository: ${{ inputs.githubRepository }}"
            exit 1
          fi
          cd target-repo
          git remote set-url origin "https://github.com/${{ inputs.githubRepository }}.git"
          DEFAULT_BRANCH=$(git symbolic-ref refs/remotes/origin/HEAD 2>/dev/null | sed 's@^refs/remotes/origin/@@' || echo "main")
          echo "DEFAULT_BRANCH=${DEFAULT_BRANCH}" >> "$GITHUB_ENV"

      # ── Step 4: Fetch External Documentation (conditional) ──────────
      - name: Fetch External Documentation
        id: fetch-docs
        if: inputs.docUrl != ''
        env:
          DOC_URL: ${{ inputs.docUrl }}
        run: |
          # Validate URL scheme — only HTTPS allowed (prevents SSRF via http/file/ftp/gopher)
          if [[ ! "${DOC_URL}" =~ ^https:// ]]; then
            echo "::error::docUrl must use https:// scheme. Got: ${DOC_URL%%://*}://"
            exit 1
          fi

          # Extract hostname and resolve to IP to block private/link-local ranges
          DOC_HOST="${DOC_URL#https://}"
          # Strip userinfo (user:pass@) if present
          DOC_HOST="${DOC_HOST#*@}"
          # Handle IPv6 bracket notation (e.g., [2001:db8::1])
          if [[ "$DOC_HOST" == \[* ]]; then
            DOC_HOST="${DOC_HOST#\[}"
            DOC_HOST="${DOC_HOST%%\]*}"
          else
            DOC_HOST="${DOC_HOST%%[/:]*}"
          fi
          RESOLVED_IPS=$(getent hosts "${DOC_HOST}" 2>/dev/null | awk '{print $1}' || true)
          if [ -z "$RESOLVED_IPS" ]; then
            echo "::warning::Cannot resolve hostname '${DOC_HOST}', proceeding with codebase only"
            echo "DOC_URL_USED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          for ip in $RESOLVED_IPS; do
            if [[ "$ip" =~ ^(10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.|169\.254\.|127\.|0\.|::1|fe80:|f[cd][0-9a-f][0-9a-f]:) ]]; then
              echo "::error::docUrl resolves to private/link-local IP (${ip}). Blocked for SSRF protection."
              exit 1
            fi
          done

          echo "Fetching documentation from: ${DOC_URL}"
          DOC_CONTENT=$(curl -s --max-redirs 0 --max-time 30 "${DOC_URL}" 2>/dev/null || echo "")
          if [ -z "$DOC_CONTENT" ]; then
            echo "::warning::Documentation URL unreachable, proceeding with codebase only"
            echo "DOC_URL_USED=false" >> "$GITHUB_ENV"
          else
            echo "$DOC_CONTENT" > /tmp/external-docs.txt
            echo "DOC_URL_USED=true" >> "$GITHUB_ENV"
            echo "External documentation fetched ($(wc -c < /tmp/external-docs.txt) bytes)"
          fi

      # ── Step 5: Configure Git ───────────────────────────────────────
      - name: Configure Git
        working-directory: target-repo
        run: |
          git config user.email "ai-board[bot]@users.noreply.github.com"
          git config user.name "ai-board[bot]"

      # ── Step 6: Setup tools ─────────────────────────────────────────
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'

      # ── Step 6b: Create plugin symlinks ─────────────────────────────
      - name: Create plugin symlinks
        working-directory: target-repo
        run: |
          mkdir -p .claude
          ln -sf ../../ai-board/.claude-plugin/commands .claude/commands

      # ── Step 7: Execute retro-spec agent command ────────────────────
      - name: Generate specifications
        id: generate-specs
        continue-on-error: true
        working-directory: target-repo
        env:
          INPUT_CONTEXT: ${{ inputs.context }}
          INPUT_DEPTH: ${{ inputs.depth }}
        run: |
          ARGS="--depth=${INPUT_DEPTH}"
          if [ -f /tmp/external-docs.txt ]; then
            ARGS="${ARGS} --external-docs=/tmp/external-docs.txt"
          fi
          if [ -n "${INPUT_CONTEXT}" ]; then
            ARGS="${ARGS} --context=\"${INPUT_CONTEXT}\""
          fi

          bash ../ai-board/.github/scripts/run-agent.sh \
            "${{ inputs.agent }}" \
            "ai-board.retro-spec" \
            "${ARGS}"

      - name: Check spec generation result
        run: |
          if [ "${{ steps.generate-specs.outcome }}" = "failure" ]; then
            echo "GENERATION_FAILED=true" >> "$GITHUB_ENV"
            echo "Spec generation failed"
            exit 1
          fi

      # ── Step 8: Commit and Push ─────────────────────────────────────
      - name: Stage and commit specs
        id: commit
        working-directory: target-repo
        env:
          REPO_TOKEN: ${{ steps.fetch-github-token.outputs.repo_token }}
        run: |
          echo "::add-mask::${REPO_TOKEN}"

          # Stage generated specs
          if ! git add specs/specifications/ 2>/dev/null; then
            echo "No specs/specifications/ directory found"
            echo "NO_SPECS=true" >> "$GITHUB_ENV"
            exit 1
          fi

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "NO_CHANGES=true" >> "$GITHUB_ENV"
          else
            git commit -m "docs: generate project specifications (retro-spec, depth=${{ inputs.depth }})"
            git remote set-url origin "https://x-access-token:${REPO_TOKEN}@github.com/${{ inputs.githubRepository }}.git"
            if ! git push origin "${DEFAULT_BRANCH}"; then
              git remote set-url origin "https://github.com/${{ inputs.githubRepository }}.git"
              echo "PUSH_FAILED=true" >> "$GITHUB_ENV"
              exit 1
            fi
            git remote set-url origin "https://github.com/${{ inputs.githubRepository }}.git"
            COMMIT_SHA=$(git rev-parse HEAD)
            echo "COMMIT_SHA=${COMMIT_SHA}" >> "$GITHUB_ENV"
          fi

      # ── Step 9: Report COMPLETED ────────────────────────────────────
      - name: Report COMPLETED
        if: success()
        working-directory: target-repo
        run: |
          # List generated spec files
          SPEC_FILES="[]"
          if [ -d "specs/specifications" ]; then
            SPEC_FILES=$(find specs/specifications -name "*.md" -type f | jq -R . | jq -s .)
          fi

          ARTIFACT_SUMMARY=$(jq -n \
            --arg depth "${{ inputs.depth }}" \
            --arg commitSha "${COMMIT_SHA:-}" \
            --argjson files "$SPEC_FILES" \
            --argjson docUrlUsed "${DOC_URL_USED:-false}" \
            '{
              depth: $depth,
              files: $files,
              docUrlUsed: $docUrlUsed
            }
            + (if $commitSha != "" then {commitSha: $commitSha} else {} end)')

          curl -sf -X PATCH \
            "${{ env.APP_URL }}/api/projects/${{ inputs.project_id }}/setup/jobs/${{ inputs.job_id }}/status" \
            -H "Authorization: Bearer ${{ env.WORKFLOW_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --argjson summary "$ARTIFACT_SUMMARY" '{"status":"COMPLETED","artifactSummary":$summary}')" || true

      # ── Error Handlers ──────────────────────────────────────────────
      - name: Report FAILED — Clone failed
        if: failure() && env.CLONE_FAILED == 'true'
        run: |
          curl -sf -X PATCH \
            "${{ env.APP_URL }}/api/projects/${{ inputs.project_id }}/setup/jobs/${{ inputs.job_id }}/status" \
            -H "Authorization: Bearer ${{ env.WORKFLOW_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"status":"FAILED","errorMessage":"Failed to clone target repository: ${{ inputs.githubRepository }}"}' || true

      - name: Report FAILED — Credential fetch failed
        if: failure() && env.CREDENTIAL_FAILED == 'true'
        run: |
          curl -sf -X PATCH \
            "${{ env.APP_URL }}/api/projects/${{ inputs.project_id }}/setup/jobs/${{ inputs.job_id }}/status" \
            -H "Authorization: Bearer ${{ env.WORKFLOW_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"status":"FAILED","errorMessage":"Failed to fetch owner AI credential"}' || true

      - name: Report FAILED — Generation failed
        if: failure() && env.GENERATION_FAILED == 'true'
        run: |
          curl -sf -X PATCH \
            "${{ env.APP_URL }}/api/projects/${{ inputs.project_id }}/setup/jobs/${{ inputs.job_id }}/status" \
            -H "Authorization: Bearer ${{ env.WORKFLOW_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"status":"FAILED","errorMessage":"Spec generation failed"}' || true

      - name: Report FAILED — Push failed
        if: failure() && env.PUSH_FAILED == 'true'
        run: |
          curl -sf -X PATCH \
            "${{ env.APP_URL }}/api/projects/${{ inputs.project_id }}/setup/jobs/${{ inputs.job_id }}/status" \
            -H "Authorization: Bearer ${{ env.WORKFLOW_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"status":"FAILED","errorMessage":"Failed to push specs to target repository"}' || true

      - name: Report FAILED — No specs generated
        if: failure() && env.NO_SPECS == 'true'
        run: |
          curl -sf -X PATCH \
            "${{ env.APP_URL }}/api/projects/${{ inputs.project_id }}/setup/jobs/${{ inputs.job_id }}/status" \
            -H "Authorization: Bearer ${{ env.WORKFLOW_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"status":"FAILED","errorMessage":"No specs/specifications/ directory was generated"}' || true

      - name: Report FAILED — Catch-all
        if: failure() && env.CLONE_FAILED != 'true' && env.CREDENTIAL_FAILED != 'true' && env.GENERATION_FAILED != 'true' && env.PUSH_FAILED != 'true' && env.NO_SPECS != 'true'
        run: |
          curl -sf -X PATCH \
            "${{ env.APP_URL }}/api/projects/${{ inputs.project_id }}/setup/jobs/${{ inputs.job_id }}/status" \
            -H "Authorization: Bearer ${{ env.WORKFLOW_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"status":"FAILED","errorMessage":"Retro-spec workflow failed unexpectedly"}' || true

      - name: Report FAILED — Cancelled
        if: cancelled()
        run: |
          curl -sf -X PATCH \
            "${{ env.APP_URL }}/api/projects/${{ inputs.project_id }}/setup/jobs/${{ inputs.job_id }}/status" \
            -H "Authorization: Bearer ${{ env.WORKFLOW_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"status":"FAILED","errorMessage":"Retro-spec workflow was cancelled"}' || true
