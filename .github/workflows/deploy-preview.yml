name: Deploy Preview

on:
  workflow_dispatch:
    inputs:
      ticket_id:
        description: 'Ticket ID to deploy'
        required: true
        type: string
      project_id:
        description: 'Project ID for authorization'
        required: true
        type: string
      branch:
        description: 'Git branch to deploy'
        required: true
        type: string
      job_id:
        description: 'Job ID to update status'
        required: true
        type: string

      githubRepository:
        description: 'GitHub repository in format owner/repo (e.g., bfernandez31/ai-board)'
        required: true
        type: string

env:
  APP_URL: ${{ vars.APP_URL }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  WORKFLOW_API_TOKEN: ${{ secrets.WORKFLOW_API_TOKEN }}

jobs:
  deploy:
    name: Deploy to Vercel Preview (Manual)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # --- Update job to RUNNING ---
      - name: Update job status → RUNNING
        run: |
          HTTP_CODE=$(curl -s -X PATCH \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.WORKFLOW_API_TOKEN }}" \
            -d '{"status": "RUNNING", "workflowRunId": ${{ github.run_id }}}' \
            -o /dev/null -w "%{http_code}" \
            ${{ env.APP_URL }}/api/jobs/${{ inputs.job_id }}/status) || true
          if [ "$HTTP_CODE" = "409" ]; then
            echo "🚫 Job already CANCELLED — aborting workflow"
            exit 1
          elif [ "$HTTP_CODE" != "200" ]; then
            echo "⚠️ Failed to update job status to RUNNING (HTTP $HTTP_CODE)"
          fi

      # --- Fetch owner's GitHub token for external repo access ---
      - name: Fetch Owner GitHub Token
        id: fetch-github-token
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            "${APP_URL}/api/internal/github-token?projectId=${{ inputs.project_id }}" \
            -H "Authorization: Bearer ${{ env.WORKFLOW_API_TOKEN }}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          if [ "$HTTP_CODE" = "200" ]; then
            TOKEN_B64=$(echo "$BODY" | jq -r '.token')
            echo "::add-mask::${TOKEN_B64}"
            OWNER_GH_TOKEN=$(echo "$TOKEN_B64" | base64 -d)
            echo "::add-mask::${OWNER_GH_TOKEN}"
            echo "repo_token=${OWNER_GH_TOKEN}" >> "$GITHUB_OUTPUT"
            echo "Owner GitHub token loaded"
          else
            echo "Owner GitHub token not available (HTTP $HTTP_CODE) — falling back to GH_PAT"
            echo "repo_token=${{ secrets.GH_PAT }}" >> "$GITHUB_OUTPUT"
          fi

      # --- Checkout the branch to deploy ---
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          # Checkout external project repository (format: owner/repo)
          repository: ${{ inputs.githubRepository }}
          ref: ${{ inputs.branch }}
          token: ${{ steps.fetch-github-token.outputs.repo_token }}

      # --- Install Vercel CLI ---
      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # --- Deploy to Vercel Preview ---
      - name: Deploy to Vercel Preview
        id: deploy
        run: |
          echo "🚀 Deploying branch '${{ inputs.branch }}' to Vercel Preview..."

          # Deploy and capture the output (vercel CLI waits for deployment to complete)
          DEPLOY_OUTPUT=$(vercel deploy \
            --yes \
            --token=${{ secrets.VERCEL_TOKEN }} \
            2>&1 | tee /tmp/deploy.log)

          # Extract the preview URL (last line starting with https://)
          DEPLOYMENT_URL=$(echo "$DEPLOY_OUTPUT" | grep -oP 'https://[a-z0-9-]+\.vercel\.app' | tail -1)

          if [ -z "$DEPLOYMENT_URL" ]; then
            echo "❌ Failed to extract deployment URL from Vercel output"
            echo "Full output:"
            cat /tmp/deploy.log
            exit 1
          fi

          echo "✅ Deployed to: $DEPLOYMENT_URL"
          echo "url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT

      # --- Update ticket with preview URL ---
      - name: Update ticket preview URL
        if: success()
        run: |
          echo "🔗 Updating ticket preview URL..."
          curl -s -X PATCH \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.WORKFLOW_API_TOKEN }}" \
            -d "{\"previewUrl\": \"${{ steps.deploy.outputs.url }}\"}" \
            ${{ env.APP_URL }}/api/projects/${{ inputs.project_id }}/tickets/${{ inputs.ticket_id }}/preview-url

      # --- Update job status to COMPLETED ---
      - name: Update job status → COMPLETED
        if: success()
        run: |
          curl -s -X PATCH \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.WORKFLOW_API_TOKEN }}" \
            -d '{"status": "COMPLETED"}' \
            ${{ env.APP_URL }}/api/jobs/${{ inputs.job_id }}/status

      # --- Update job status to FAILED ---
      - name: Update job status → FAILED
        if: failure()
        run: |
          curl -s -X PATCH \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.WORKFLOW_API_TOKEN }}" \
            -d '{"status": "FAILED"}' \
            ${{ env.APP_URL }}/api/jobs/${{ inputs.job_id }}/status
