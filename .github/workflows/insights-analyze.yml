name: Insights Analyze
# AIB-791: run Claude Code /insights over the native session JSONL corpus
# for a given window and finalize the report row + HTML artifact.

on:
  workflow_dispatch:
    inputs:
      report_id:
        description: 'InsightsReport.id to finalize'
        required: true
        type: string
      job_id:
        description: 'Companion Job.id for status PATCH and log capture'
        required: true
        type: string
      project_id:
        description: 'Host Project.id used to resolve the Anthropic credential'
        required: true
        type: string
      period_start:
        description: 'ISO 8601 lower bound (inclusive)'
        required: true
        type: string
      period_end:
        description: 'ISO 8601 upper bound (exclusive)'
        required: true
        type: string

jobs:
  analyze:
    runs-on: ubuntu-latest
    # Buffer below INSIGHTS_RUN_TIMEOUT_MINUTES (default 60) so the workflow
    # surfaces its own failure before reconciliation auto-FAILs the row.
    timeout-minutes: 50
    env:
      APP_URL: ${{ vars.APP_URL }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: PATCH job status -> RUNNING
        # AIB-807: include `workflowRunId` so the FAILED-report diagnostics
        # pane can surface a GitHub Actions link. Without this, the
        # `githubActionsUrl` field on the report serializes as null.
        run: |
          curl -fsS -X PATCH "${APP_URL}/api/jobs/${{ inputs.job_id }}/status" \
            -H "Authorization: Bearer ${{ secrets.WORKFLOW_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"status":"RUNNING","workflowRunId":${{ github.run_id }}}'

      - name: Enumerate Claude sessions in window
        id: enumerate
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer ${{ secrets.WORKFLOW_API_TOKEN }}" \
            "${APP_URL}/api/admin/insights/jobs?periodStart=${{ inputs.period_start }}&periodEnd=${{ inputs.period_end }}" \
            > jobs.json
          echo "session_count=$(jq '.jobs | length' jobs.json)" >> "$GITHUB_OUTPUT"

      - name: Download raw native session JSONL artifacts
        run: |
          set -euo pipefail
          # /insights scans the local Claude Code session store at
          # ~/.claude/projects/<encoded-cwd>/*.jsonl. We mirror the downloaded
          # JSONLs there (encoded-cwd = cwd with `/` and `.` mapped to `-`)
          # so the slash command sees them as if they were locally-recorded
          # sessions. The command itself takes no arguments.
          ENCODED_CWD="$(echo "$PWD" | sed -e 's|/|-|g' -e 's|\.|-|g')"
          CLAUDE_SESSIONS_DIR="${HOME}/.claude/projects/${ENCODED_CWD}"
          mkdir -p "${CLAUDE_SESSIONS_DIR}"
          # Refuse to proceed with an empty session set — running /insights
          # against an empty directory would silently produce a vacuous
          # COMPLETED report (sessionsCount=0). The pre-flight gate already
          # rejects this case, so an empty enumeration here means a raw-log
          # artifact was pruned between enumeration and download.
          session_count=$(jq '.jobs | length' jobs.json)
          if [ "$session_count" -eq 0 ]; then
            echo "INSIGHTS_FAILURE_REASON=No Claude session artifacts available for the requested window" >> "$GITHUB_ENV"
            echo "Aborting: no sessions in window"
            exit 1
          fi
          # Two artifact formats live in Vercel Blob:
          #   - tar.gz (new): preserves the native `<sessionId>.jsonl` filenames
          #     /insights expects. Extract directly into the sessions dir.
          #   - jsonl.gz (legacy): concat of all sessions for a job. Decompress
          #     then split by internal sessionId via the Python helper.
          # Detect by trying `tar -tzf`; fall back to gunzip+split on failure.
          DOWNLOAD_DIR="$(mktemp -d)"
          jq -c '.jobs[]' jobs.json | while read -r row; do
            jobId=$(echo "$row" | jq -r .jobId)
            archive="${DOWNLOAD_DIR}/${jobId}.gz"
            curl -fsS \
              -H "Authorization: Bearer ${{ secrets.WORKFLOW_API_TOKEN }}" \
              "${APP_URL}/api/admin/insights/jobs/${jobId}/raw-native" \
              -o "${archive}"
            if tar -tzf "${archive}" >/dev/null 2>&1; then
              tar -xzf "${archive}" -C "${CLAUDE_SESSIONS_DIR}"
            else
              # Legacy concat layout: decompress as <jobId>.jsonl so the splitter
              # below can read it. Filename is non-UUID and will be split away.
              gunzip -c "${archive}" > "${CLAUDE_SESSIONS_DIR}/${jobId}.jsonl"
            fi
            rm -f "${archive}"
          done
          rmdir "${DOWNLOAD_DIR}" 2>/dev/null || true

          # Legacy compat: any file that isn't already a `<sessionId>.jsonl`
          # (UUID basename) must be split by internal sessionId so /insights'
          # rO_() — which derives sessionId from the basename — can see them.
          # New tar.gz artifacts already have UUID names; the splitter no-ops.
          python3 - "${CLAUDE_SESSIONS_DIR}" <<'PY'
          import json, os, sys
          outdir = sys.argv[1]
          for name in os.listdir(outdir):
              src = os.path.join(outdir, name)
              if not os.path.isfile(src) or not name.endswith('.jsonl'):
                  continue
              groups = {}
              with open(src, encoding='utf-8') as f:
                  for line in f:
                      line = line.strip()
                      if not line:
                          continue
                      try:
                          obj = json.loads(line)
                      except Exception:
                          continue
                      sid = obj.get('sessionId')
                      if not sid:
                          continue
                      groups.setdefault(sid, []).append(line)
              # If the basename is already a UUID-shaped sessionId and the file
              # contains exactly one session matching, leave it alone.
              base = name[:-len('.jsonl')]
              if len(groups) == 1 and base in groups:
                  continue
              for sid, lines in groups.items():
                  dst = os.path.join(outdir, f'{sid}.jsonl')
                  # Append-safe (multiple jobs could carry the same session).
                  with open(dst, 'a', encoding='utf-8') as out:
                      out.write('\n'.join(lines))
                      out.write('\n')
              os.unlink(src)
          PY

      - name: Fetch Anthropic credential
        run: |
          set -euo pipefail
          echo "🔑 Fetching Anthropic credential for host project ${{ inputs.project_id }}..."
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            "${APP_URL}/api/internal/credentials?projectId=${{ inputs.project_id }}&provider=ANTHROPIC" \
            -H "Authorization: Bearer ${{ secrets.WORKFLOW_API_TOKEN }}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ℹ️  No Anthropic credential found (HTTP $HTTP_CODE) — falling back to repo secret"
          else
            CRED_VALUE_B64=$(echo "$BODY" | jq -r '.value')
            echo "::add-mask::${CRED_VALUE_B64}"
            CRED_VALUE=$(echo "$CRED_VALUE_B64" | base64 -d)
            echo "::add-mask::${CRED_VALUE}"
            {
              echo "CLAUDE_CODE_OAUTH_TOKEN<<CREDENTIAL_EOF"
              echo "${CRED_VALUE}"
              echo "CREDENTIAL_EOF"
            } >> "$GITHUB_ENV"
            echo "✅ Anthropic credential loaded"
          fi

      - name: Run Claude Code /insights
        id: insights
        env:
          WORKFLOW_API_TOKEN: ${{ secrets.WORKFLOW_API_TOKEN }}
          JOB_ID: ${{ inputs.job_id }}
        run: |
          set -euo pipefail
          # FR-011: invoke the real /insights slash command — never a free-text
          # prompt. The slash command takes no arguments; it scans the local
          # session store seeded in the previous step. Delegated to
          # .github/scripts/run-agent.sh which centralizes Claude CLI install
          # (npm, not bunx — see in-script note), auth, and raw-log capture.
          ./.github/scripts/run-agent.sh CLAUDE insights

      - name: Collect insights report
        run: |
          set -euo pipefail
          # /insights writes to a fixed path under ~/.claude/usage-data/.
          # Move it into the workspace where downstream steps expect it.
          if [ ! -f "${HOME}/.claude/usage-data/report.html" ]; then
            echo "INSIGHTS_FAILURE_REASON=Insights did not produce a report" >> "$GITHUB_ENV"
            echo "❌ No report.html generated by /insights"
            exit 1
          fi
          mv "${HOME}/.claude/usage-data/report.html" ./report.html

      - name: Validate output (structural markers)
        run: |
          set -euo pipefail
          for marker in "Suggested CLAUDE.md Additions" 'id="section-wins"' 'id="section-horizon"' 'id="section-friction"'; do
            grep -F -q "$marker" report.html || {
              echo "INSIGHTS_FAILURE_REASON=Insights output validation failed" >> "$GITHUB_ENV"
              echo "Missing marker: $marker"
              exit 1
            }
          done

      - name: Upload artifact via /finalize
        id: finalize
        run: |
          set -euo pipefail
          response=$(curl -sS -w "\n%{http_code}" \
            -X PUT "${APP_URL}/api/admin/insights/reports/${{ inputs.report_id }}/finalize" \
            -H "Authorization: Bearer ${{ secrets.WORKFLOW_API_TOKEN }}" \
            -H "Content-Type: text/html; charset=utf-8" \
            --data-binary @report.html)
          code=$(echo "$response" | tail -n 1)
          body=$(echo "$response" | sed '$d')
          if [ "$code" = "422" ]; then
            echo "INSIGHTS_FAILURE_REASON=Insights output validation failed" >> "$GITHUB_ENV"
            echo "Finalize rejected output: $body"
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "INSIGHTS_FAILURE_REASON=Artifact upload rejected by storage" >> "$GITHUB_ENV"
            echo "Finalize failed (status $code): $body"
            exit 1
          fi
          echo "artifact_size=$(echo "$body" | jq -r .artifactSize)" >> "$GITHUB_OUTPUT"

      - name: Compute counts
        id: counts
        run: |
          set -euo pipefail
          session_count=${{ steps.enumerate.outputs.session_count }}
          ticket_count=$(jq '[.jobs[].ticketId] | unique | length' jobs.json)
          echo "session_count=$session_count" >> "$GITHUB_OUTPUT"
          echo "ticket_count=$ticket_count" >> "$GITHUB_OUTPUT"

      - name: PATCH report status -> COMPLETED
        run: |
          set -euo pipefail
          payload=$(jq -n \
            --arg status 'COMPLETED' \
            --argjson sc ${{ steps.counts.outputs.session_count }} \
            --argjson tc ${{ steps.counts.outputs.ticket_count }} \
            --arg ak "insights/reports/${{ inputs.report_id }}.html" \
            --argjson asz ${{ steps.finalize.outputs.artifact_size }} \
            '{status:$status, sessionsCount:$sc, ticketsCount:$tc, artifactKey:$ak, artifactSize:$asz}')
          curl -fsS -X PATCH \
            "${APP_URL}/api/admin/insights/reports/${{ inputs.report_id }}/status" \
            -H "Authorization: Bearer ${{ secrets.WORKFLOW_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$payload"

      - name: PATCH job status -> COMPLETED
        if: success()
        run: |
          curl -fsS -X PATCH "${APP_URL}/api/jobs/${{ inputs.job_id }}/status" \
            -H "Authorization: Bearer ${{ secrets.WORKFLOW_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"status":"COMPLETED"}'

      - name: Report failure
        if: failure()
        run: |
          reason="${INSIGHTS_FAILURE_REASON:-Workflow step failed; see workflow logs}"
          curl -fsS -X PATCH \
            "${APP_URL}/api/admin/insights/reports/${{ inputs.report_id }}/status" \
            -H "Authorization: Bearer ${{ secrets.WORKFLOW_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg status 'FAILED' --arg er "$reason" '{status:$status, errorReason:$er}')"
          curl -fsS -X PATCH \
            "${APP_URL}/api/jobs/${{ inputs.job_id }}/status" \
            -H "Authorization: Bearer ${{ secrets.WORKFLOW_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"status":"FAILED"}'
