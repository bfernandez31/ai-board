name: Admin Insights Analyze

on:
  workflow_dispatch:
    inputs:
      report_id:
        description: 'AdminInsightsReport.id of the row already created in DB'
        required: true
        type: string
      period_start:
        description: 'ISO-8601 inclusive lower bound of the analysis window'
        required: true
        type: string
      period_end:
        description: 'ISO-8601 exclusive upper bound of the analysis window'
        required: true
        type: string

env:
  APP_URL: ${{ vars.APP_URL }}
  WORKFLOW_API_TOKEN: ${{ secrets.WORKFLOW_API_TOKEN }}
  CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
  REPORT_ID: ${{ inputs.report_id }}
  PERIOD_START: ${{ inputs.period_start }}
  PERIOD_END: ${{ inputs.period_end }}

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: PATCH status RUNNING (with workflowRunId)
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl -s -X PATCH \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${WORKFLOW_API_TOKEN}" \
            -d "{\"status\": \"RUNNING\", \"workflowRunId\": ${{ github.run_id }}}" \
            -o /tmp/running.json -w "%{http_code}" \
            "${APP_URL}/api/admin/insights/reports/${REPORT_ID}/status")
          if [ "$HTTP_CODE" = "409" ]; then
            echo "::error::Report already finalized — aborting"
            exit 1
          elif [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Unexpected status=$HTTP_CODE while reporting RUNNING"
            cat /tmp/running.json
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.1

      - name: Install Claude Code CLI
        run: |
          set -euo pipefail
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Enumerate raw Claude artifacts
        id: enumerate
        run: |
          set -euo pipefail
          curl -sS -G \
            -H "Authorization: Bearer ${WORKFLOW_API_TOKEN}" \
            --data-urlencode "periodStart=${PERIOD_START}" \
            --data-urlencode "periodEnd=${PERIOD_END}" \
            "${APP_URL}/api/internal/admin-insights/raw-artifacts" \
            > /tmp/artifacts.json
          sessions_count=$(jq -r 'length' /tmp/artifacts.json)
          tickets_count=$(jq -r '[.[].ticketId] | unique | length' /tmp/artifacts.json)
          echo "sessions_count=${sessions_count}" >> "$GITHUB_OUTPUT"
          echo "tickets_count=${tickets_count}" >> "$GITHUB_OUTPUT"

      - name: Download raw Claude artifacts
        run: |
          set -euo pipefail
          mkdir -p /tmp/sessions
          jq -c '.[]' /tmp/artifacts.json | while read -r row; do
            JOB_ID=$(echo "$row" | jq -r '.jobId')
            PROJECT_ID=$(echo "$row" | jq -r '.projectId')
            TICKET_ID=$(echo "$row" | jq -r '.ticketId')
            curl -sS -L \
              -H "Authorization: Bearer ${WORKFLOW_API_TOKEN}" \
              "${APP_URL}/api/projects/${PROJECT_ID}/tickets/${TICKET_ID}/jobs/${JOB_ID}/logs/raw-native" \
              -o "/tmp/sessions/${JOB_ID}.jsonl.gz"
          done

      - name: Run Claude /insights
        run: |
          set -euo pipefail
          claude /insights \
            --input-dir /tmp/sessions \
            --output-html /tmp/report.html \
            --period-start "${PERIOD_START}" \
            --period-end "${PERIOD_END}"
          test -s /tmp/report.html

      - name: PUT HTML body
        id: upload
        run: |
          set -euo pipefail
          SIZE=$(stat -c%s /tmp/report.html)
          curl -sS -X PUT \
            -H "Content-Type: text/html; charset=utf-8" \
            -H "Authorization: Bearer ${WORKFLOW_API_TOKEN}" \
            -H "Content-Length: ${SIZE}" \
            --data-binary @/tmp/report.html \
            "${APP_URL}/api/admin/insights/reports/${REPORT_ID}/html" \
            -o /tmp/upload.json
          jq -r '.htmlBlobKey' /tmp/upload.json > /tmp/blob_key
          jq -r '.htmlBlobSize' /tmp/upload.json > /tmp/blob_size
          echo "blob_key=$(cat /tmp/blob_key)" >> "$GITHUB_OUTPUT"
          echo "blob_size=$(cat /tmp/blob_size)" >> "$GITHUB_OUTPUT"

      - name: PATCH status COMPLETED
        if: success()
        run: |
          set -euo pipefail
          curl -sS -X PATCH \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${WORKFLOW_API_TOKEN}" \
            -d "$(jq -n \
              --arg key '${{ steps.upload.outputs.blob_key }}' \
              --argjson size ${{ steps.upload.outputs.blob_size }} \
              --argjson sessionsCount ${{ steps.enumerate.outputs.sessions_count }} \
              --argjson ticketsCount ${{ steps.enumerate.outputs.tickets_count }} \
              '{status: "COMPLETED", sessionsCount: $sessionsCount, ticketsCount: $ticketsCount, htmlBlobKey: $key, htmlBlobSize: $size}')" \
            "${APP_URL}/api/admin/insights/reports/${REPORT_ID}/status"

      - name: PATCH status FAILED on failure
        if: failure()
        run: |
          set +e
          REASON="Workflow step failed; see GitHub Actions log run ${{ github.run_id }}"
          REASON="${REASON:0:2000}"
          curl -sS -X PATCH \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${WORKFLOW_API_TOKEN}" \
            -d "$(jq -n --arg r "$REASON" '{status: "FAILED", errorReason: $r}')" \
            "${APP_URL}/api/admin/insights/reports/${REPORT_ID}/status"
