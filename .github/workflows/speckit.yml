name: Spec-Kit Workflow Execution
# Manual trigger workflow for spec-kit command execution

on:
  workflow_dispatch:
    inputs:
      ticket_id:
        description: 'Ticket identifier (e.g., 016, PROJ-123)'
        required: true
        type: string

      attachments:
        description: 'JSON array of ticket attachments (images for Claude context)'
        required: false
        type: string
        default: '[]'

      specifyPayload:
        description: 'JSON payload with featureDescription and clarificationPolicy (overrides ticketTitle/ticketDescription)'
        required: false
        type: string
        default: ''

      branch:
        description: 'Target branch (optional for specify, required for others)'
        required: false
        type: string
        default: ''

      command:
        description: 'Spec-kit command to execute'
        required: true
        type: choice
        options:
          - specify
          - plan
          - task
          - implement
          - clarify

      answers_json:
        description: 'JSON answers for clarify command (optional)'
        required: false
        type: string
        default: '{}'

      job_id:
        description: 'Job ID for status tracking (optional)'
        required: false
        type: string
        default: ''

      project_id:
        description: 'Project ID (required for specify command to update ticket branch)'
        required: false
        type: string
        default: ''

      githubRepository:
        description: 'GitHub repository in format owner/repo (e.g., bfernandez31/ai-board)'
        required: true
        type: string

      agent:
        description: 'Agent CLI to use (CLAUDE or CODEX)'
        required: false
        type: string
        default: 'CLAUDE'

      # Conditional service inputs
      needs_postgres:
        description: 'Provision PostgreSQL service container'
        required: false
        default: 'false'
        type: boolean
      needs_redis:
        description: 'Provision Redis service container'
        required: false
        default: 'false'
        type: boolean
      needs_mysql:
        description: 'Provision MySQL service container'
        required: false
        default: 'false'
        type: boolean
      needs_mongo:
        description: 'Provision MongoDB service container'
        required: false
        default: 'false'
        type: boolean

      # Version inputs
      postgres_version:
        description: 'PostgreSQL version tag'
        required: false
        default: '14'
        type: string
      redis_version:
        description: 'Redis version tag'
        required: false
        default: '7'
        type: string
      mysql_version:
        description: 'MySQL version tag'
        required: false
        default: '8'
        type: string
      mongo_version:
        description: 'MongoDB version tag'
        required: false
        default: '7'
        type: string

jobs:
  run-speckit:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    permissions:
      contents: write
      pull-requests: write

    # Conditional service containers — only provisioned when needs_* is true
    services:
      postgres:
        image: ${{ inputs.needs_postgres && format('postgres:{0}', inputs.postgres_version) || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_board_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: ${{ inputs.needs_redis && format('redis:{0}', inputs.redis_version) || '' }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: ${{ inputs.needs_mysql && format('mysql:{0}', inputs.mysql_version) || '' }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongo:
        image: ${{ inputs.needs_mongo && format('mongo:{0}', inputs.mongo_version) || '' }}
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      SKIP_SPECKIT_EXECUTION: ${{ contains(inputs.ticket_id, '[e2e]') }}
      APP_URL: ${{ vars.APP_URL }}
      WORKFLOW_API_TOKEN: ${{ secrets.WORKFLOW_API_TOKEN }}
      # Use Opus model for Claude Code
      ANTHROPIC_MODEL: "claude-opus-4-6"
      # DATABASE_URL provided by .ai-board/config.yml env section via setup-environment.sh
      # Claude Code telemetry - send to OTLP endpoint
      CLAUDE_CODE_ENABLE_TELEMETRY: "1"
      OTEL_LOGS_EXPORTER: "otlp"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/json"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.APP_URL }}/api/telemetry
      OTEL_EXPORTER_OTLP_HEADERS: "Authorization=Bearer ${{ secrets.WORKFLOW_API_TOKEN }}"
      OTEL_RESOURCE_ATTRIBUTES: "job_id=${{ inputs.job_id }}"
      # Batch log exports — every 60s instead of defaults (Claude Code: 5s, Codex/Rust: 1s)
      OTEL_LOGS_EXPORT_INTERVAL: "60000"
      OTEL_BLRP_SCHEDULE_DELAY: "60000"

    steps:
      - name: Debug Inputs
        run: |
          echo "🔍 Debug workflow inputs:"
          echo "  ticket_id: ${{ inputs.ticket_id }}"
          echo "  project_id: ${{ inputs.project_id }}"
          echo "  job_id: ${{ inputs.job_id }}"
          echo "  command: ${{ inputs.command }}"
          echo "  githubRepository: ${{ inputs.githubRepository }}"

      - name: Report E2E Skip
        if: ${{ env.SKIP_SPECKIT_EXECUTION == 'true' }}
        run: |
          echo "ℹ️ '[e2e]' detected in ticket title; skipping Spec-Kit execution to preserve resources"

      - name: Update Job Status - Running
        if: ${{ inputs.job_id }}
        run: |
          HTTP_CODE=$(curl -X PATCH "${APP_URL}/api/jobs/${{ inputs.job_id }}/status" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${WORKFLOW_API_TOKEN}" \
            -d '{"status": "RUNNING", "workflowRunId": ${{ github.run_id }}}' \
            -s -o /dev/null -w "%{http_code}") || true
          if [ "$HTTP_CODE" = "409" ]; then
            echo "🚫 Job already CANCELLED — aborting workflow"
            exit 1
          elif [ "$HTTP_CODE" != "200" ]; then
            echo "⚠️ Failed to update job status to RUNNING (HTTP $HTTP_CODE)"
          fi

      - name: Fetch Owner AI Credential
        if: ${{ env.SKIP_SPECKIT_EXECUTION != 'true' && inputs.project_id }}
        run: |
          echo "🔑 Fetching owner AI credential for project ${{ inputs.project_id }}..."
          AGENT="${{ inputs.agent }}"
          if [[ "$AGENT" == "CODEX" ]]; then PROVIDER="OPENAI"; elif [[ "$AGENT" == "MISTRAL" ]]; then PROVIDER="MISTRAL"; else PROVIDER="ANTHROPIC"; fi
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            "${APP_URL}/api/internal/credentials?projectId=${{ inputs.project_id }}&provider=${PROVIDER}" \
            -H "Authorization: Bearer ${WORKFLOW_API_TOKEN}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          if [ "$HTTP_CODE" != "200" ]; then
            echo "⚠️ No owner credential found (HTTP $HTTP_CODE) — using repository secrets as fallback"
          else
            CRED_TYPE=$(echo "$BODY" | jq -r '.credentialType')
            ENV_VAR=$(echo "$BODY" | jq -r '.envVar')
            CRED_VALUE_B64=$(echo "$BODY" | jq -r '.value')
            echo "::add-mask::${CRED_VALUE_B64}"
            CRED_VALUE=$(echo "$CRED_VALUE_B64" | base64 -d)

            # Mask the credential value in logs
            echo "::add-mask::${CRED_VALUE}"

            # Export to GITHUB_ENV (heredoc for multi-line values like auth.json)
            {
              echo "${ENV_VAR}<<CREDENTIAL_EOF"
              echo "${CRED_VALUE}"
              echo "CREDENTIAL_EOF"
            } >> "$GITHUB_ENV"
            echo "✅ Owner credential loaded (type: ${CRED_TYPE}, envVar: ${ENV_VAR})"
          fi
          echo "PROJECT_ID=${{ inputs.project_id }}" >> "$GITHUB_ENV"

      - name: Checkout ai-board (sparse - plugin only)
        if: ${{ env.SKIP_SPECKIT_EXECUTION != 'true' }}
        uses: actions/checkout@v4
        with:
          path: ai-board
          sparse-checkout: |
            .claude-plugin
            .github/scripts
          sparse-checkout-cone-mode: true

      - name: Fetch Owner GitHub Token
        if: ${{ env.SKIP_SPECKIT_EXECUTION != 'true' }}
        id: fetch-github-token
        env:
          GH_PAT_FALLBACK: ${{ secrets.GH_PAT }}
        run: |
          TOKEN=$(bash ai-board/.github/scripts/fetch-repo-token.sh "${{ inputs.project_id }}")
          echo "::add-mask::${TOKEN}"
          echo "repo_token=${TOKEN}" >> "$GITHUB_OUTPUT"

      - name: Detect default branch
        if: ${{ env.SKIP_SPECKIT_EXECUTION != 'true' }}
        id: default-branch
        env:
          GH_TOKEN: ${{ steps.fetch-github-token.outputs.repo_token }}
        run: |
          DEFAULT_BRANCH=$(gh api "repos/${{ inputs.githubRepository }}" --jq '.default_branch')
          echo "branch=$DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"
          echo "DEFAULT_BRANCH=$DEFAULT_BRANCH" >> "$GITHUB_ENV"
          echo "Default branch: $DEFAULT_BRANCH"

      - name: Checkout target repository
        if: ${{ env.SKIP_SPECKIT_EXECUTION != 'true' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.githubRepository }}
          ref: ${{ inputs.command == 'specify' && steps.default-branch.outputs.branch || inputs.branch || github.ref }}
          token: ${{ steps.fetch-github-token.outputs.repo_token }}
          fetch-depth: 0
          path: target

      - name: Setup Bun
        if: ${{ env.SKIP_SPECKIT_EXECUTION != 'true' }}
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.1

      - name: Cache Bun Dependencies
        if: ${{ env.SKIP_SPECKIT_EXECUTION != 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('target/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Setup Node.js
        if: ${{ env.SKIP_SPECKIT_EXECUTION != 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'

      - name: Setup Python
        if: ${{ env.SKIP_SPECKIT_EXECUTION != 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Environment (lightweight)
        if: ${{ env.SKIP_SPECKIT_EXECUTION != 'true' && inputs.command != 'implement' }}
        run: ai-board/.github/scripts/setup-environment.sh target --phase lightweight

      - name: Setup Environment (full)
        if: ${{ env.SKIP_SPECKIT_EXECUTION != 'true' && inputs.command == 'implement' }}
        run: ai-board/.github/scripts/setup-environment.sh target --phase full

      - name: Install Dependencies
        if: ${{ env.SKIP_SPECKIT_EXECUTION != 'true' && inputs.command == 'implement' }}
        run: ai-board/.github/scripts/run-command.sh target install

      - name: Post-Install Setup (ORM)
        if: ${{ env.SKIP_SPECKIT_EXECUTION != 'true' && inputs.command == 'implement' }}
        run: ai-board/.github/scripts/setup-environment.sh target --phase post-install

      - name: Configure Git
        if: ${{ env.SKIP_SPECKIT_EXECUTION != 'true' }}
        run: |
          git config --global user.name "ai-board[bot]"
          git config --global user.email "bot@ai-board.app"

      - name: Setup Test Environment
        if: ${{ env.SKIP_SPECKIT_EXECUTION != 'true' && inputs.command == 'implement' }}
        working-directory: target
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          echo "🔧 Setting up test environment..."
          ../ai-board/.github/scripts/setup-test-env.sh

      - name: Prepare Images for Claude (Specify Command)
        if: ${{ env.SKIP_SPECKIT_EXECUTION != 'true' && inputs.command == 'specify' && inputs.attachments != '[]' }}
        working-directory: target
        run: |
          set -e

          # Call reusable script to download and prepare images
          IMAGE_PATHS=$(../ai-board/.claude-plugin/scripts/bash/prepare-images.sh \
            "${{ inputs.ticket_id }}" \
            '${{ inputs.attachments }}')

          # Store image paths for Claude execution step
          echo "IMAGE_PATHS=$IMAGE_PATHS" >> "$GITHUB_ENV"
          echo "IMAGE_COUNT=$(echo $IMAGE_PATHS | wc -w | tr -d ' ')" >> "$GITHUB_ENV"

      - name: Prepare Specify Payload
        if: ${{ env.SKIP_SPECKIT_EXECUTION != 'true' && inputs.command == 'specify' && inputs.specifyPayload != '' }}
        run: |
          # Write JSON payload to temp file to avoid bash escaping issues
          cat > /tmp/specify_payload.json <<'EOF'
          ${{ inputs.specifyPayload }}
          EOF
          echo "SPECIFY_PAYLOAD_FILE=/tmp/specify_payload.json" >> "$GITHUB_ENV"

      - name: Seed Test Database
        if: ${{ env.SKIP_SPECKIT_EXECUTION != 'true' && inputs.command == 'implement' }}
        run: ai-board/.github/scripts/run-command.sh target db_seed

      # Playwright setup steps (implement command only)
      - name: Get Playwright Version
        if: ${{ env.SKIP_SPECKIT_EXECUTION != 'true' && inputs.command == 'implement' && env.HAS_PLAYWRIGHT == 'true' }}
        working-directory: target
        id: playwright-version
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> $GITHUB_OUTPUT

      - name: Cache Playwright Browsers
        if: ${{ env.SKIP_SPECKIT_EXECUTION != 'true' && inputs.command == 'implement' && env.HAS_PLAYWRIGHT == 'true' }}
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Browsers
        if: ${{ env.SKIP_SPECKIT_EXECUTION != 'true' && inputs.command == 'implement' && env.HAS_PLAYWRIGHT == 'true' && steps.playwright-cache.outputs.cache-hit != 'true' }}
        working-directory: target
        run: npx playwright install chromium --with-deps

      - name: Execute Spec-Kit Command
        if: ${{ env.SKIP_SPECKIT_EXECUTION != 'true' }}
        working-directory: target
        run: |
          set -e

          case "${{ inputs.command }}" in
            specify)
              echo "📦 Using JSON payload with clarification policy"

              # Read payload from file
              payload=$(cat "$SPECIFY_PAYLOAD_FILE")

              # Add image paths if available
              if [ -n "$IMAGE_PATHS" ] && [ "$IMAGE_COUNT" -gt 0 ]; then
                echo "🖼️  Passing $IMAGE_COUNT images to Claude for visual context"
                ../ai-board/.github/scripts/run-agent.sh "${{ inputs.agent }}" "ai-board.specify" "$payload" $IMAGE_PATHS
              else
                ../ai-board/.github/scripts/run-agent.sh "${{ inputs.agent }}" "ai-board.specify" "$payload"
              fi
              ;;
            plan)
              echo "📋 Executing /ai-board.plan command..."
              ../ai-board/.github/scripts/run-agent.sh "${{ inputs.agent }}" "ai-board.plan"

              # Commit plan changes
              git add .
              if ! git diff --staged --quiet; then
                git commit -m "feat(ticket-${{ inputs.ticket_id }}): plan - automated spec-kit execution

          Generated by GitHub Actions workflow
          Ticket: ${{ inputs.ticket_id }}
          Command: plan
          Phase: Planning"

                current_branch="$(git rev-parse --abbrev-ref HEAD)"
                git push origin "$current_branch"
                echo "✅ Plan changes committed and pushed"
              else
                echo "ℹ️ No plan changes to commit"
              fi

              echo "📋 Executing /ai-board.tasks command..."
              ../ai-board/.github/scripts/run-agent.sh "${{ inputs.agent }}" "ai-board.tasks"

              # Commit tasks changes
              git add .
              if ! git diff --staged --quiet; then
                git commit -m "feat(ticket-${{ inputs.ticket_id }}): tasks - automated spec-kit execution

          Generated by GitHub Actions workflow
          Ticket: ${{ inputs.ticket_id }}
          Command: plan
          Phase: Task generation"

                current_branch="$(git rev-parse --abbrev-ref HEAD)"
                git push origin "$current_branch"
                echo "✅ Tasks changes committed and pushed"
              else
                echo "ℹ️ No tasks changes to commit"
              fi
              ;;
            task)
              ../ai-board/.github/scripts/run-agent.sh "${{ inputs.agent }}" "ai-board.tasks"
              ;;
            implement)
              ../ai-board/.github/scripts/run-agent.sh "${{ inputs.agent }}" "ai-board.implement" "IMPORTANT: never prompt me; you must always fix and complete the implementation, never run the full test suite, only impacted tests. CRITICAL: After completing each task, immediately update tasks.md to mark it as ✅ DONE. Do the commit and push, continue fix if needed"
              ;;
            clarify)
              echo '${{ inputs.answers_json }}' > clarifications.json
              ../ai-board/.github/scripts/run-agent.sh "${{ inputs.agent }}" "ai-board.clarify" "--answers clarifications.json"
              ;;
            *)
              echo "❌ Unknown command: ${{ inputs.command }}"
              exit 1
              ;;
          esac

      - name: Detect Incomplete Implementation (Implement Command)
        if: ${{ env.SKIP_SPECKIT_EXECUTION != 'true' && inputs.command == 'implement' }}
        working-directory: target
        id: detect-incomplete
        run: |
          set -e

          FEATURE_DIR="specs/$(git rev-parse --abbrev-ref HEAD)"

          if [[ ! -d "$FEATURE_DIR" ]]; then
            echo "⚠️  Feature directory not found: $FEATURE_DIR"
            echo "needs_continue=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "🔍 Checking: $FEATURE_DIR"

          if ! ../ai-board/.claude-plugin/scripts/bash/detect-incomplete-implementation.sh "$FEATURE_DIR" --json > /tmp/detection.json; then
            cat /tmp/detection.json
            needs_continue=$(jq -r '.needs_continue' /tmp/detection.json)
            incomplete=$(jq -r '.incomplete_tasks' /tmp/detection.json)

            echo "needs_continue=$needs_continue" >> $GITHUB_OUTPUT

            if [[ "$needs_continue" == "true" ]]; then
              echo "⚠️  Incomplete: $incomplete tasks remaining"
            fi
          else
            echo "✅ Complete"
            echo "needs_continue=false" >> $GITHUB_OUTPUT
          fi

      - name: Continue Implementation (Retry Loop)
        if: ${{ env.SKIP_SPECKIT_EXECUTION != 'true' && inputs.command == 'implement' && steps.detect-incomplete.outputs.needs_continue == 'true' }}
        working-directory: target
        run: |
          set -e
          MAX_RETRIES=2
          FEATURE_DIR="specs/$(git rev-parse --abbrev-ref HEAD)"

          for retry in $(seq 1 $MAX_RETRIES); do
            echo "🔄 Retry $retry/$MAX_RETRIES"

            ../ai-board/.github/scripts/run-agent.sh "${{ inputs.agent }}" "ai-board.implement" "--continue IMPORTANT: never prompt me; you must always fix and complete the implementation, never run the full test suite, only impacted tests. CRITICAL: After completing each task, immediately update tasks.md to mark it as ✅ DONE. Do the commit and push, continue fix if needed" || true

            if ../ai-board/.claude-plugin/scripts/bash/detect-incomplete-implementation.sh "$FEATURE_DIR" --json > /tmp/retry.json; then
              echo "✅ Complete after $retry retries"
              break
            fi

            needs_continue=$(jq -r '.needs_continue' /tmp/retry.json)
            if [[ "$needs_continue" != "true" ]]; then
              echo "✅ Intentionally scoped"
              break
            fi

            if [[ $retry -eq $MAX_RETRIES ]]; then
              echo "⚠️  Max retries reached"
            fi
          done

      - name: Capture Current Branch
        if: ${{ env.SKIP_SPECKIT_EXECUTION != 'true' }}
        working-directory: target
        env:
          DEFAULT_BRANCH: ${{ inputs.branch || github.ref_name }}
        run: |
          current_branch="$(git rev-parse --abbrev-ref HEAD)"

          if [ -z "$current_branch" ] || [ "$current_branch" = "HEAD" ]; then
            current_branch="$DEFAULT_BRANCH"
          fi

          echo "CURRENT_BRANCH=$current_branch" >> "$GITHUB_ENV"

          # For specify command, also store branch for ticket update
          if [ "${{ inputs.command }}" = "specify" ]; then
            echo "FEATURE_BRANCH=$current_branch" >> "$GITHUB_ENV"
          fi

      - name: Guard against default branch push
        if: ${{ env.SKIP_SPECKIT_EXECUTION != 'true' }}
        run: |
          if [ "$CURRENT_BRANCH" = "$DEFAULT_BRANCH" ]; then
            echo "🚫 FATAL: Agent stayed on default branch '$DEFAULT_BRANCH' instead of creating a feature branch."
            echo "   This would pollute the default branch with uncommitted spec/plan artifacts."
            echo "   Aborting to protect repository integrity."
            exit 1
          fi
          echo "✅ Branch guard passed: '$CURRENT_BRANCH' ≠ '$DEFAULT_BRANCH'"

      - name: Cleanup Temporary Images Before Commit
        if: ${{ env.SKIP_SPECKIT_EXECUTION != 'true' && inputs.command == 'specify' && env.IMAGE_COUNT != '' && env.IMAGE_COUNT != '0' }}
        working-directory: target
        run: |
          echo "🧹 Cleaning up temporary image files before commit..."
          TICKET_ASSETS_DIR="ticket-assets/${{ inputs.ticket_id }}"
          if [ -d "$TICKET_ASSETS_DIR" ]; then
            rm -rf "$TICKET_ASSETS_DIR"
            echo "  ✅ Removed temporary directory: $TICKET_ASSETS_DIR"
          fi
          echo "✅ Cleanup complete (images remain in Cloudinary)"

      - name: Commit and Push Changes
        if: ${{ env.SKIP_SPECKIT_EXECUTION != 'true' }}
        working-directory: target
        run: |
          git add .

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "✅ No changes to commit (Claude may have already committed)"
          else
            git commit -m "feat(ticket-${{ inputs.ticket_id }}): ${{ inputs.command }} - automated spec-kit execution

          Generated by GitHub Actions workflow
          Ticket: ${{ inputs.ticket_id }}
          Command: ${{ inputs.command }}
          Branch: ${CURRENT_BRANCH}"
            echo "✅ Changes committed"
          fi

          # Always push (Claude may have committed during command execution)
          if [ -z "$CURRENT_BRANCH" ]; then
            echo "⚠️ Unable to determine branch to push; skipping git push"
          else
            git push origin "$CURRENT_BRANCH"
            echo "✅ Changes pushed to branch: ${CURRENT_BRANCH}"
          fi

      # Documentation update removed - now handled in verify workflow
      # Global documentation is updated only once before PR creation (verify stage)
      # This avoids:
      # - Multiple doc commits during spec iterations
      # - Conflicts on global documentation files
      # - Outdated docs during development phases

      - name: Update Ticket Branch (Specify Command)
        if: ${{ success() && env.SKIP_SPECKIT_EXECUTION != 'true' && inputs.command == 'specify' && env.FEATURE_BRANCH != '' }}
        env:
          TICKET_ID: ${{ inputs.ticket_id }}
          PROJECT_ID: ${{ inputs.project_id }}
        run: |
          # Update ticket branch field via API
          curl -X PATCH "${APP_URL}/api/projects/${PROJECT_ID}/tickets/${TICKET_ID}/branch" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${WORKFLOW_API_TOKEN}" \
            -d "{\"branch\": \"${FEATURE_BRANCH}\"}" \
            -f -s -S || echo "⚠️ Failed to update ticket branch field"

          echo "✅ Updated ticket branch to: ${FEATURE_BRANCH}"

      - name: Cleanup Temporary Images (Specify Command)
        if: ${{ always() && env.SKIP_SPECKIT_EXECUTION != 'true' && inputs.command == 'specify' && env.IMAGE_COUNT != '' && env.IMAGE_COUNT != '0' }}
        working-directory: target
        run: |
          set -e

          echo "🧹 Cleaning up temporary image files..."

          # Remove temporary ticket assets directory
          TICKET_ASSETS_DIR="ticket-assets/${{ inputs.ticket_id }}"
          if [ -d "$TICKET_ASSETS_DIR" ]; then
            rm -rf "$TICKET_ASSETS_DIR"
            echo "  ✅ Removed temporary directory: $TICKET_ASSETS_DIR"
          fi

          echo "✅ Cleanup complete (images remain in Cloudinary)"

      - name: Update Job Status - Success
        if: ${{ success() && inputs.job_id && env.SKIP_SPECKIT_EXECUTION != 'true' }}
        run: |
          curl -X PATCH "${APP_URL}/api/jobs/${{ inputs.job_id }}/status" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${WORKFLOW_API_TOKEN}" \
            -d '{"status": "COMPLETED"}' \
            -f -s -S || echo "⚠️ Failed to update job status to COMPLETED"

      - name: Update Job Status - Skipped (E2E)
        if: ${{ success() && inputs.job_id && env.SKIP_SPECKIT_EXECUTION == 'true' }}
        run: |
          curl -X PATCH "${APP_URL}/api/jobs/${{ inputs.job_id }}/status" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${WORKFLOW_API_TOKEN}" \
            -d '{"status": "COMPLETED"}' \
            -f -s -S || echo "⚠️ Failed to update job status to COMPLETED"

      - name: Update Job Status - Failure
        if: ${{ failure() && inputs.job_id }}
        run: |
          curl -X PATCH "${APP_URL}/api/jobs/${{ inputs.job_id }}/status" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${WORKFLOW_API_TOKEN}" \
            -d '{"status": "FAILED"}' \
            -f -s -S || echo "⚠️ Failed to update job status to FAILED"

      - name: Update Job Status - Cancelled
        if: ${{ cancelled() && inputs.job_id }}
        run: |
          curl -X PATCH "${APP_URL}/api/jobs/${{ inputs.job_id }}/status" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${WORKFLOW_API_TOKEN}" \
            -d '{"status": "CANCELLED"}' \
            -f -s -S || echo "⚠️ Failed to update job status to CANCELLED"

      - name: Transition to VERIFY (Implement Command)
        if: ${{ success() && env.SKIP_SPECKIT_EXECUTION != 'true' && inputs.command == 'implement' }}
        working-directory: target
        env:
          TICKET_ID: ${{ inputs.ticket_id }}
          PROJECT_ID: ${{ inputs.project_id }}
        run: |
          echo "🔄 Transitioning ticket to VERIFY stage..."
          echo "   This will trigger the verify workflow to run tests and create PR"
          ../ai-board/.claude-plugin/scripts/bash/transition-to-verify.sh \
            "${TICKET_ID}" \
            "${PROJECT_ID}" \
            "${APP_URL}" \
            "${WORKFLOW_API_TOKEN}"

      - name: Report Success (Skipped)
        if: ${{ success() && env.SKIP_SPECKIT_EXECUTION == 'true' }}
        run: |
          echo "✅ Spec-kit execution skipped because ticket title contains '[e2e]'"
          echo "📍 Branch: ${{ inputs.branch || github.ref_name }}"
          echo "🎫 Ticket: ${{ inputs.ticket_id }}"

      - name: Report Success
        if: ${{ success() && env.SKIP_SPECKIT_EXECUTION != 'true' }}
        run: |
          echo "✅ Spec-kit command '${{ inputs.command }}' completed successfully"
          echo "📍 Branch: ${CURRENT_BRANCH:-${{ inputs.branch || github.ref_name }}}"
          echo "🎫 Ticket: ${{ inputs.ticket_id }}"
          if [ "${{ inputs.command }}" = "implement" ]; then
            echo "🔄 Ticket transitioned to VERIFY - tests will run next"
          fi

      - name: Report Failure
        if: failure()
        run: |
          echo "❌ Spec-kit command '${{ inputs.command }}' failed"
          echo "📋 Check logs above for error details"
          exit 1
