name: Quick Implementation Workflow
# Fast-track workflow for simple tasks bypassing SPECIFY and PLAN stages

on:
  workflow_dispatch:
    inputs:
      ticket_id:
        description: 'Ticket identifier (e.g., 016, PROJ-123)'
        required: true
        type: string

      quickImplPayload:
        description: 'JSON payload with title and description'
        required: true
        type: string

      attachments:
        description: 'JSON array of ticket attachments (images for Claude context)'
        required: false
        type: string
        default: '[]'

      job_id:
        description: 'Job ID for status tracking (optional)'
        required: false
        type: string
        default: ''

      project_id:
        description: 'Project ID for API calls'
        required: true
        type: string

      githubRepository:
        description: 'GitHub repository in format owner/repo (e.g., bfernandez31/ai-board)'
        required: true
        type: string

      agent:
        description: 'Agent CLI to use (CLAUDE or CODEX)'
        required: false
        type: string
        default: 'CLAUDE'

      # Conditional service inputs
      needs_postgres:
        description: 'Provision PostgreSQL service container'
        required: false
        default: 'false'
        type: boolean
      needs_redis:
        description: 'Provision Redis service container'
        required: false
        default: 'false'
        type: boolean
      needs_mysql:
        description: 'Provision MySQL service container'
        required: false
        default: 'false'
        type: boolean
      needs_mongo:
        description: 'Provision MongoDB service container'
        required: false
        default: 'false'
        type: boolean

      # Version inputs
      postgres_version:
        description: 'PostgreSQL version tag'
        required: false
        default: '14'
        type: string
      redis_version:
        description: 'Redis version tag'
        required: false
        default: '7'
        type: string
      mysql_version:
        description: 'MySQL version tag'
        required: false
        default: '8'
        type: string
      mongo_version:
        description: 'MongoDB version tag'
        required: false
        default: '7'
        type: string

jobs:
  quick-impl:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # Temporarily matched to full spec-kit timeout (AIB-225)

    permissions:
      contents: write
      pull-requests: write

    # Conditional service containers — only provisioned when needs_* is true
    services:
      postgres:
        image: ${{ inputs.needs_postgres && format('postgres:{0}', inputs.postgres_version) || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_board_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: ${{ inputs.needs_redis && format('redis:{0}', inputs.redis_version) || '' }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: ${{ inputs.needs_mysql && format('mysql:{0}', inputs.mysql_version) || '' }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongo:
        image: ${{ inputs.needs_mongo && format('mongo:{0}', inputs.mongo_version) || '' }}
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      SKIP_EXECUTION: ${{ contains(inputs.ticket_id, '[e2e]') }}
      APP_URL: ${{ vars.APP_URL }}
      WORKFLOW_API_TOKEN: ${{ secrets.WORKFLOW_API_TOKEN }}
      # Use Opus model for Claude Code
      ANTHROPIC_MODEL: "claude-opus-4-6"
      # DATABASE_URL provided by .ai-board/config.yml env section via setup-environment.sh
      # Claude Code telemetry - send to OTLP endpoint
      CLAUDE_CODE_ENABLE_TELEMETRY: "1"
      OTEL_LOGS_EXPORTER: "otlp"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/json"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.APP_URL }}/api/telemetry
      OTEL_EXPORTER_OTLP_HEADERS: "Authorization=Bearer ${{ secrets.WORKFLOW_API_TOKEN }}"
      OTEL_RESOURCE_ATTRIBUTES: "job_id=${{ inputs.job_id }}"
      # Batch log exports — every 60s instead of defaults (Claude Code: 5s, Codex/Rust: 1s)
      OTEL_LOGS_EXPORT_INTERVAL: "60000"
      OTEL_BLRP_SCHEDULE_DELAY: "60000"

    steps:
      - name: Debug Inputs
        run: |
          echo "🔍 Debug workflow inputs:"
          echo "  ticket_id: ${{ inputs.ticket_id }}"
          echo "  job_id: ${{ inputs.job_id }}"
          echo "  project_id: ${{ inputs.project_id }}"
          echo "  githubRepository: ${{ inputs.githubRepository }}"

      - name: Report E2E Skip
        if: ${{ env.SKIP_EXECUTION == 'true' }}
        run: |
          echo "ℹ️ '[e2e]' detected in ticket title; skipping execution to preserve resources"

      - name: Update Job Status - Running
        if: ${{ inputs.job_id }}
        run: |
          HTTP_CODE=$(curl -X PATCH "${APP_URL}/api/jobs/${{ inputs.job_id }}/status" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${WORKFLOW_API_TOKEN}" \
            -d '{"status": "RUNNING", "workflowRunId": ${{ github.run_id }}}' \
            -s -o /dev/null -w "%{http_code}") || true
          if [ "$HTTP_CODE" = "409" ]; then
            echo "🚫 Job already CANCELLED — aborting workflow"
            exit 1
          elif [ "$HTTP_CODE" != "200" ]; then
            echo "⚠️ Failed to update job status to RUNNING (HTTP $HTTP_CODE)"
          fi

      - name: Fetch Owner AI Credential
        if: ${{ env.SKIP_EXECUTION != 'true' && inputs.project_id }}
        run: |
          echo "🔑 Fetching owner AI credential for project ${{ inputs.project_id }}..."
          PROVIDER=$( [[ "${{ inputs.agent }}" == "CODEX" ]] && echo "OPENAI" || echo "ANTHROPIC" )
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            "${APP_URL}/api/internal/credentials?projectId=${{ inputs.project_id }}&provider=${PROVIDER}" \
            -H "Authorization: Bearer ${WORKFLOW_API_TOKEN}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          if [ "$HTTP_CODE" != "200" ]; then
            echo "⚠️ No owner credential found (HTTP $HTTP_CODE) — using repository secrets as fallback"
          else
            CRED_TYPE=$(echo "$BODY" | jq -r '.credentialType')
            ENV_VAR=$(echo "$BODY" | jq -r '.envVar')
            CRED_VALUE_B64=$(echo "$BODY" | jq -r '.value')
            echo "::add-mask::${CRED_VALUE_B64}"
            CRED_VALUE=$(echo "$CRED_VALUE_B64" | base64 -d)
            echo "::add-mask::${CRED_VALUE}"
            {
              echo "${ENV_VAR}<<CREDENTIAL_EOF"
              echo "${CRED_VALUE}"
              echo "CREDENTIAL_EOF"
            } >> "$GITHUB_ENV"
            echo "✅ Owner credential loaded (type: ${CRED_TYPE}, envVar: ${ENV_VAR})"
          fi
          echo "PROJECT_ID=${{ inputs.project_id }}" >> "$GITHUB_ENV"

      - name: Checkout ai-board (sparse - plugin only)
        if: ${{ env.SKIP_EXECUTION != 'true' }}
        uses: actions/checkout@v4
        with:
          path: ai-board
          sparse-checkout: |
            .claude-plugin
            .github/scripts
          sparse-checkout-cone-mode: true

      - name: Fetch Owner GitHub Token
        if: ${{ env.SKIP_EXECUTION != 'true' }}
        id: fetch-github-token
        env:
          GH_PAT_FALLBACK: ${{ secrets.GH_PAT }}
        run: |
          TOKEN=$(bash ai-board/.github/scripts/fetch-repo-token.sh "${{ inputs.project_id }}")
          echo "::add-mask::${TOKEN}"
          echo "repo_token=${TOKEN}" >> "$GITHUB_OUTPUT"

      - name: Detect default branch
        if: ${{ env.SKIP_EXECUTION != 'true' }}
        id: default-branch
        env:
          GH_TOKEN: ${{ steps.fetch-github-token.outputs.repo_token }}
        run: |
          DEFAULT_BRANCH=$(gh api "repos/${{ inputs.githubRepository }}" --jq '.default_branch')
          echo "branch=$DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"
          echo "Default branch: $DEFAULT_BRANCH"

      - name: Checkout target repository
        if: ${{ env.SKIP_EXECUTION != 'true' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.githubRepository }}
          ref: ${{ steps.default-branch.outputs.branch }}
          token: ${{ steps.fetch-github-token.outputs.repo_token }}
          fetch-depth: 0
          path: target

      - name: Setup Bun
        if: ${{ env.SKIP_EXECUTION != 'true' }}
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.1

      - name: Setup Node.js
        if: ${{ env.SKIP_EXECUTION != 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'

      - name: Setup Python
        if: ${{ env.SKIP_EXECUTION != 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Environment
        if: ${{ env.SKIP_EXECUTION != 'true' }}
        run: ai-board/.github/scripts/setup-environment.sh target --phase full

      - name: Install Dependencies
        if: ${{ env.SKIP_EXECUTION != 'true' }}
        run: ai-board/.github/scripts/run-command.sh target install

      - name: Post-Install Setup (ORM)
        if: ${{ env.SKIP_EXECUTION != 'true' }}
        run: ai-board/.github/scripts/setup-environment.sh target --phase post-install

      - name: Configure Git
        if: ${{ env.SKIP_EXECUTION != 'true' }}
        run: |
          git config --global user.name "ai-board[bot]"
          git config --global user.email "bot@ai-board.app"

      - name: Setup Test Environment
        if: ${{ env.SKIP_EXECUTION != 'true' }}
        working-directory: target
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          echo "🔧 Setting up test environment..."
          ../ai-board/.github/scripts/setup-test-env.sh

      - name: Prepare Quick-Impl Payload
        if: ${{ env.SKIP_EXECUTION != 'true' }}
        run: |
          # Write JSON payload to temp file
          cat > /tmp/quick_impl_payload.json <<'EOF'
          ${{ inputs.quickImplPayload }}
          EOF
          echo "QUICK_IMPL_PAYLOAD_FILE=/tmp/quick_impl_payload.json" >> "$GITHUB_ENV"

      - name: Prepare Images for Claude
        if: ${{ env.SKIP_EXECUTION != 'true' && inputs.attachments != '[]' }}
        working-directory: target
        run: |
          set -e

          # Call reusable script to download and prepare images
          IMAGE_PATHS=$(../ai-board/.claude-plugin/scripts/bash/prepare-images.sh \
            "${{ inputs.ticket_id }}" \
            '${{ inputs.attachments }}')

          # Store image paths for Claude execution step
          echo "IMAGE_PATHS=$IMAGE_PATHS" >> "$GITHUB_ENV"
          echo "IMAGE_COUNT=$(echo $IMAGE_PATHS | wc -w | tr -d ' ')" >> "$GITHUB_ENV"

      - name: Seed Test Database
        if: ${{ env.SKIP_EXECUTION != 'true' }}
        run: ai-board/.github/scripts/run-command.sh target db_seed

      # Playwright setup steps
      - name: Get Playwright Version
        if: ${{ env.SKIP_EXECUTION != 'true' && env.HAS_PLAYWRIGHT == 'true' }}
        working-directory: target
        id: playwright-version
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> $GITHUB_OUTPUT

      - name: Cache Playwright Browsers
        if: ${{ env.SKIP_EXECUTION != 'true' && env.HAS_PLAYWRIGHT == 'true' }}
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Browsers
        if: ${{ env.SKIP_EXECUTION != 'true' && env.HAS_PLAYWRIGHT == 'true' && steps.playwright-cache.outputs.cache-hit != 'true' }}
        working-directory: target
        run: npx playwright install chromium --with-deps

      - name: Execute Quick Implementation
        if: ${{ env.SKIP_EXECUTION != 'true' }}
        working-directory: target
        run: |
          # Execute /quick-impl command with JSON payload
          # Command will internally call create-new-feature.sh --mode=quick-impl
          payload=$(cat "$QUICK_IMPL_PAYLOAD_FILE")

          # Add image paths if available
          if [ -n "$IMAGE_PATHS" ] && [ "$IMAGE_COUNT" -gt 0 ]; then
            echo "🖼️  Passing $IMAGE_COUNT images to Claude for visual context"
            ../ai-board/.github/scripts/run-agent.sh "${{ inputs.agent }}" "ai-board.quick-impl" "$payload IMPORTANT: never prompt me; you must do the full implementation, never run the full test suite, only impacted tests" $IMAGE_PATHS
          else
            ../ai-board/.github/scripts/run-agent.sh "${{ inputs.agent }}" "ai-board.quick-impl" "$payload IMPORTANT: never prompt me; you must do the full implementation, never run the full test suite, only impacted tests"
          fi

      - name: Capture Branch Name
        if: ${{ env.SKIP_EXECUTION != 'true' }}
        working-directory: target
        run: |
          # Capture the branch created by /quick-impl command
          current_branch="$(git rev-parse --abbrev-ref HEAD)"
          echo "FEATURE_BRANCH=$current_branch" >> "$GITHUB_ENV"
          echo "✅ Feature branch: $current_branch"

      - name: Cleanup Temporary Images Before Commit
        if: ${{ env.SKIP_EXECUTION != 'true' && env.IMAGE_COUNT != '' && env.IMAGE_COUNT != '0' }}
        working-directory: target
        run: |
          echo "🧹 Cleaning up temporary image files before commit..."
          TICKET_ASSETS_DIR="ticket-assets/${{ inputs.ticket_id }}"
          if [ -d "$TICKET_ASSETS_DIR" ]; then
            rm -rf "$TICKET_ASSETS_DIR"
            echo "  ✅ Removed temporary directory: $TICKET_ASSETS_DIR"
          fi
          echo "✅ Cleanup complete (images remain in Cloudinary)"

      # Documentation update removed - now handled in verify workflow
      # Global documentation is updated only once before PR creation (verify stage)
      # This avoids:
      # - Multiple doc commits during spec iterations
      # - Conflicts on global documentation files
      # - Outdated docs during development phases

      - name: Commit and Push Changes
        if: ${{ env.SKIP_EXECUTION != 'true' }}
        working-directory: target
        run: |
          git add .

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "✅ No changes to commit (Claude may have already committed)"
          else
            git commit -m "feat(ticket-${{ inputs.ticket_id }}): quick-impl - automated implementation" \
              -m "Generated by GitHub Actions workflow (quick-impl)" \
              -m "Ticket: ${{ inputs.ticket_id }}" \
              -m "Branch: ${FEATURE_BRANCH}"
            echo "✅ Changes committed"
          fi

          # Always push (Claude may have committed during /quick-impl execution)
          git push origin "$FEATURE_BRANCH"
          echo "✅ Changes pushed to branch: ${FEATURE_BRANCH}"

      - name: Update Ticket Branch
        if: ${{ success() && env.SKIP_EXECUTION != 'true' && env.FEATURE_BRANCH != '' }}
        env:
          TICKET_ID: ${{ inputs.ticket_id }}
          PROJECT_ID: ${{ inputs.project_id }}
        run: |
          # Update ticket branch field via API
          curl -X PATCH "${APP_URL}/api/projects/${PROJECT_ID}/tickets/${TICKET_ID}/branch" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${WORKFLOW_API_TOKEN}" \
            -d "{\"branch\": \"${FEATURE_BRANCH}\"}" \
            -f -s -S || echo "⚠️ Failed to update ticket branch field"

          echo "✅ Updated ticket branch to: ${FEATURE_BRANCH}"

      - name: Cleanup Temporary Images
        if: ${{ always() && env.SKIP_EXECUTION != 'true' && env.IMAGE_COUNT != '' && env.IMAGE_COUNT != '0' }}
        working-directory: target
        run: |
          set -e

          echo "🧹 Cleaning up temporary image files..."

          # Remove temporary ticket assets directory
          TICKET_ASSETS_DIR="ticket-assets/${{ inputs.ticket_id }}"
          if [ -d "$TICKET_ASSETS_DIR" ]; then
            rm -rf "$TICKET_ASSETS_DIR"
            echo "  ✅ Removed temporary directory: $TICKET_ASSETS_DIR"
          fi

          echo "✅ Cleanup complete (images remain in Cloudinary)"

      - name: Update Job Status - Success
        if: ${{ success() && inputs.job_id && env.SKIP_EXECUTION != 'true' }}
        run: |
          curl -X PATCH "${APP_URL}/api/jobs/${{ inputs.job_id }}/status" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${WORKFLOW_API_TOKEN}" \
            -d '{"status": "COMPLETED"}' \
            -f -s -S || echo "⚠️ Failed to update job status to COMPLETED"

      - name: Update Job Status - Skipped (E2E)
        if: ${{ success() && inputs.job_id && env.SKIP_EXECUTION == 'true' }}
        run: |
          curl -X PATCH "${APP_URL}/api/jobs/${{ inputs.job_id }}/status" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${WORKFLOW_API_TOKEN}" \
            -d '{"status": "COMPLETED"}' \
            -f -s -S || echo "⚠️ Failed to update job status to COMPLETED"

      - name: Update Job Status - Failure
        if: ${{ failure() && inputs.job_id }}
        run: |
          curl -X PATCH "${APP_URL}/api/jobs/${{ inputs.job_id }}/status" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${WORKFLOW_API_TOKEN}" \
            -d '{"status": "FAILED"}' \
            -f -s -S || echo "⚠️ Failed to update job status to FAILED"

      - name: Update Job Status - Cancelled
        if: ${{ cancelled() && inputs.job_id }}
        run: |
          curl -X PATCH "${APP_URL}/api/jobs/${{ inputs.job_id }}/status" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${WORKFLOW_API_TOKEN}" \
            -d '{"status": "CANCELLED"}' \
            -f -s -S || echo "⚠️ Failed to update job status to CANCELLED"

      - name: Transition to VERIFY
        if: ${{ success() && env.SKIP_EXECUTION != 'true' }}
        working-directory: target
        env:
          TICKET_ID: ${{ inputs.ticket_id }}
          PROJECT_ID: ${{ inputs.project_id }}
        run: |
          echo "🔄 Transitioning ticket to VERIFY stage..."
          echo "   This will trigger the verify workflow to run tests and create PR"
          ../ai-board/.claude-plugin/scripts/bash/transition-to-verify.sh \
            "${TICKET_ID}" \
            "${PROJECT_ID}" \
            "${APP_URL}" \
            "${WORKFLOW_API_TOKEN}"

      - name: Report Success (Skipped)
        if: ${{ success() && env.SKIP_EXECUTION == 'true' }}
        run: |
          echo "✅ Quick-impl execution skipped because ticket title contains '[e2e]'"
          echo "🎫 Ticket: ${{ inputs.ticket_id }}"

      - name: Report Success
        if: ${{ success() && env.SKIP_EXECUTION != 'true' }}
        run: |
          echo "✅ Quick implementation completed successfully"
          echo "📍 Branch: ${FEATURE_BRANCH}"
          echo "🎫 Ticket: ${{ inputs.ticket_id }}"
          echo "🔄 Ticket transitioned to VERIFY - tests will run next"

      - name: Report Failure
        if: failure()
        run: |
          echo "❌ Quick implementation failed"
          echo "📋 Check logs above for error details"
          echo "💡 Consider using full workflow (INBOX → SPECIFY → PLAN → BUILD) for complex features"
          exit 1
